    const fotos = await subirFotos(msg);
    msg(metodo === 'pix' ? 'Gerando o seu Pix…' : 'Abrindo o Mercado Pago…');
    track('InitiateCheckout', { currency: 'BRL', value: valor });
    await carregarConfig();
    const querEmail = !!cfg.email && S.mailMe !== false;
    const j = await api('/pagar', { metodo, plano: S.plano, extras: extrasValidos(S.plano, S.extras), email: S.email.trim(), enviarEmail: querEmail, carta: cartaParaServidor(fotos) });
    pedido = { id: j.id, chave: j.chave, pago: false, querEmail, plano: S.plano, extras: extrasValidos(S.plano, S.extras), valor }; store.set(PED, pedido);
    if (metodo === 'cartao') { location.href = j.link; return; }
    openPix(j.pix || {});
    esperarPagamento(0);
  } catch (e) { closeSheet(); toast(erroTexto(e)); }
  ocupado = false; refreshBar();
}
const PIX_MS = 2 * 36e5;
function openPix(pix) {
  const qr = String(pix.qr || '').replace(/[^A-Za-z0-9+/=]/g, ''), copia = String(pix.copia || '');
  openSheet(`<p class="eyebrow">Pix · ${brl(precoTotal(S.plano, S.extras))}</p><h2 class="h2">Pague com Pix para liberar a carta</h2>
    <div class="pix-qr">${qr ? `<img alt="QR code do Pix" src="data:image/png;base64,${qr}">` : ''}</div>
    <button class="btn btn-ghost w" id="copyPix">${ICON.copy}Copiar código Pix</button>
    <ol class="steps-ol"><li>Abra o app do seu banco e escolha Pix.</li><li>Leia o QR code ou use o Pix Copia e Cola.</li><li>Pronto: a carta é liberada aqui mesmo, na hora.</li></ol>
    <div class="waiting"><span class="spin"></span>Aguardando pagamento · o Pix vale por <b id="pixTimer">2:00:00</b></div>
    <p class="hint pix-note">Pode sair do site para pagar. Quando você voltar, a carta é liberada aqui.</p>`, () => clearInterval(timer));
  $('#copyPix').addEventListener('click', () => copyText(copia, 'Código Pix copiado'));
  /* o Pix vale por 2 horas (PT2H no pagar.mjs); depois disso o Mercado Pago cancela e é preciso gerar outro */
  const end = Date.now() + PIX_MS;
  const timer = setInterval(() => {
    const left = Math.max(0, end - Date.now()), t = $('#pixTimer'); if (!t) return clearInterval(timer);
    t.textContent = `${Math.floor(left / 36e5)}:${pad(Math.floor(left / 6e4) % 60)}:${pad(Math.floor(left / 1e3) % 60)}`;
    if (!left) { clearInterval(timer); const w = t.closest('.waiting'); if (w) w.innerHTML = 'Este Pix expirou. Feche e toque em pagar de novo para gerar outro.'; }
  }, 1000);
}
/* pergunta ao servidor se o pagamento caiu (o webhook /api/aviso também confirma do lado do servidor) */
async function esperarPagamento(n) {
  clearTimeout(esperando); esperando = null;
  if (!pedido || pedido.pago) return;
  try { const j = await api('/status?id=' + encodeURIComponent(pedido.id)); if (j.pago) return approve(j); } catch (e) {}
  /* 10 minutos de 4 em 4 segundos, depois de 8 em 8 até completar as 2 horas do Pix */
  if (n < 150 + (PIX_MS - 600e3) / 8000) esperando = setTimeout(() => esperarPagamento(n + 1), n < 150 ? 4000 : 8000);
}
document.addEventListener('visibilitychange', () => { if (!document.hidden && pedido && !pedido.pago) esperarPagamento(0); });
function approve(j = {}) {
  clearTimeout(esperando); closeSheet();
  pedido.pago = true; if (j.email === 'enviado') pedido.emailOk = true;
  if (!pedido.pagoEm) pedido.pagoEm = Date.now();
  if (!pedido.compraOk) { track('Purchase', { currency: 'BRL', value: pedido.valor || precoDe(pedido.plano) }, { eventID: 'compra_' + pedido.id }); pedido.compraOk = true; }
  store.set(PED, pedido);
  S.code = pedido.id; S.view = 'done'; save();
  if (isEmail(S.email)) acesso.email = S.email.trim().toLowerCase();
  irAcesso(pedido.id, true);
  toast('Pagamento confirmado!');
}
/* depois de pago, quem comprou pode mudar a carta por 7 dias (o servidor confere o prazo) */
async function salvarMudancas() {
  if (ocupado || !editavel()) return;
  ocupado = true; const nx = $('#nextBtn'); nx.disabled = true; nx.textContent = 'Salvando…';
  try {
    const fotos = await subirFotos(t => { nx.textContent = t; });
    await api('/atualizar', { id: pedido.id, chave: pedido.chave, carta: cartaParaServidor(fotos) });
    S.view = 'done'; save(); irAcesso(); toast('Mudanças salvas. O mesmo link já abre a carta nova.');
  } catch (e) { toast(erroTexto(e, true)); }
  ocupado = false; refreshBar();
}
function resetDraft() {
  clearTimeout(esperando); pedido = null; store.raw(PED, null);
  Object.assign(S, JSON.parse(JSON.stringify(BLANK)), { photos: Array(NFOTOS).fill(null), themeTouched: false });
  [...Array(NFOTOS).keys()].forEach(i => { store.raw(PKEY(i), null); fotosDB.guardar(i, null).catch(() => {}); });
  save(); go(0, 'back');
}

/* ----- Exemplo e prévias ----- */
function openExample(plano) {
  const L = resolveLetter({ ...EXAMPLE, photos: fotosExemplo(plano), plano });
  track('ViewContent', { content_name: plano === 'premium' ? 'Exemplo de carta Premium' : 'Exemplo de carta' });
  openViewer(L, { mode: 'example', onCreate: () => { if (S.step === 0 && S.view === 'step') { const b = $('.opt'); if (b) b.focus(); } } });
}
function openPreview(withBuy) {
  const L = resolveLetter(S);
  openViewer(L, { mode: 'preview', buy: withBuy, buyLabel: editavel() ? 'Salvar as mudanças' : '',
    onBuy: () => { if (editavel()) { if (S.view !== 'ready') { S.view = 'ready'; save(); render('fwd'); } return salvarMudancas(); } if (S.view !== 'checkout') { S.view = 'checkout'; save(); render('fwd'); } },
    onEdit: () => { if (S.view === 'ready') openEditSheet(); } });
}

/* ----- Navegação ----- */
function go(i, dir) { S.view = 'step'; S.step = Math.max(0, Math.min(STEPS.length - 1, i)); save(); render(dir || 'fwd'); }
/* "Editar alguma coisa": a pessoa muda uma etapa e volta direto para a carta pronta */
function verCartaFinal() { ui.editando = false; Music.stop(); S.view = 'ready'; save(); render('fwd'); track('ViewContent', { content_name: 'Prévia da carta' }); openPreview(true); }
const voltarParaPronta = () => { ui.editando = false; S.view = 'ready'; save(); render('fwd'); };
function next() {
  if (S.view === 'step') {
    const st = STEPS[S.step];
    if (!st.ok()) return;
    track('passo_' + st.id);
    if (st.id === 'premium') { S.plano = 'premium'; save(); track('escolheu_premium'); return go(idxPasso('extras'), 'fwd'); } // o botão de baixo é o "Quero a versão Premium"
    if (st.id === 'adicionais' && (temRec(S, 'fotos') || temRec(S, 'filme'))) return go(idxPasso('extras'), 'fwd');
    if (st.id === 'adicionais') { ui.editando = false; return verCartaFinal(); }
    if (ui.editando) return voltarParaPronta();
    const prox = passosValidos().find(i => i > S.step);
    if (prox != null) return go(prox, 'fwd');
    return verCartaFinal();
  }
  if (S.view === 'ready') { if (editavel()) return salvarMudancas(); S.view = 'checkout'; save(); render('fwd'); return; }
  if (S.view === 'checkout') pay();
}
function back() {
  if (S.view === 'step') { const ant = passosValidos().filter(i => i < S.step).pop(); if (ant != null) go(ant, 'back'); return; }
  if (S.view === 'ready') return go(ultimoPasso(), 'back');
  if (S.view === 'checkout') { S.view = 'ready'; save(); render('back'); }
}
function rerender(keepFocus) {
  const y = window.scrollY;
  render(null);
  window.scrollTo(0, y);
  if (keepFocus) { const f = $('#fReason'); if (f) f.focus({ preventScroll: true }); }
}
function changed() { save(); refreshBar(); schedulePreview(); }

function render(dir) {
  const scr = $('#screen');
  document.body.classList.toggle('na-acesso', naAcesso());
  if (naAcesso()) { scr.innerHTML = acessoView(); bindAcesso(scr); }
  else if (S.view === 'step') { if (!passoValido(S.step)) S.step = passosValidos().filter(i => i < S.step).pop() || 0; const id = STEPS[S.step].id; scr.innerHTML = VIEWS[id](); BIND[id](scr); }
  else if (S.view === 'ready') { scr.innerHTML = readyView(); bindReady(scr); }
  else if (S.view === 'checkout') { scr.innerHTML = checkoutView(); bindCheckout(scr); }
  if (dir) {
    scr.classList.remove('enter', 'enter-back'); void scr.offsetWidth; scr.classList.add(dir === 'back' ? 'enter-back' : 'enter');
    window.scrollTo(0, 0);
    const h = scr.querySelector('.h1'); if (h && document.activeElement && document.activeElement !== document.body) h.focus({ preventScroll: true });
  }
  updateChrome();
  renderMini(!!dir);
}
function updateChrome() {
  const vs = passosValidos(), n = vs.length;
  $('#stepcount').textContent = naAcesso() ? 'Meu acesso' : S.view === 'step' ? `Passo ${vs.indexOf(S.step) + 1} de ${n}` : ({ ready: editavel() ? 'Editando a carta' : 'Prévia pronta', checkout: 'Pagamento', done: 'Carta selada' })[S.view];
  $('#progress').style.setProperty('--p', `${S.view === 'step' ? (vs.indexOf(S.step) + 1) / n * 100 : 100}%`);
  refreshBar();
}
/* na etapa de adicionais, com todos marcados, aparece em destaque o botão para trocar pela Premium */
function querPremiumDosAdicionais() { S.plano = 'premium'; save(); track('escolheu_premium'); toast('Agora é Premium ✨'); go(idxPasso('extras'), 'fwd'); }
function refreshBar() {
  const bar = $('#bar'), nx = $('#nextBtn'), note = $('#barNote'), eye = $('#eyeBtn'), bp = $('#barPrem');
  const todos = S.view === 'step' && STEPS[S.step] && STEPS[S.step].id === 'adicionais' && extrasValidos(S.plano, S.extras).length === EXTRAS.length;
  if (bp) { bp.hidden = !todos; bp.innerHTML = `${ICON.sparkle}QUERO A VERSÃO PREMIUM · ${brl(PRICE_PREMIUM)}`; note.hidden = todos; bar.classList.toggle('com-prem', todos); }
  const hide = naAcesso() || (S.view === 'step' && S.step === 0);
  bar.hidden = hide; document.body.classList.toggle('nobar', hide);
  if (hide) return;
  eye.hidden = S.view === 'checkout';
  if (S.view === 'step') {
    const st = STEPS[S.step], last = S.step === ultimoPasso();
    nx.disabled = !st.ok();
    nx.innerHTML = st.id === 'premium' ? `Quero a Premium ${ICON.sparkle}` : st.id === 'adicionais' ? `Continuar · ${brl(precoTotal(S.plano, S.extras))} ${ICON.next}` : ui.editando ? `Pronto ${ICON.check}` : last ? `Ver carta final ${ICON.sparkle}` : (st.optional && st.empty() ? 'Pular' : `Continuar ${ICON.next}`);
    note.textContent = st.id === 'premium' ? `Premium: ${brl(PRICE_PREMIUM)} · vitalícia, com cinema e mini filme` : st.id === 'adicionais' ? (extrasValidos(S.plano, S.extras).length ? `Padrão + ${extrasValidos(S.plano, S.extras).length} adicional(is)` : 'Carta Padrão · sem adicionais') : ui.editando ? 'Volta para a carta pronta' : editavel() ? 'Editando a carta já paga · Salve no final' : 'Salvo neste aparelho';
  } else if (S.view === 'ready') {
    nx.disabled = ocupado;
    if (editavel()) { nx.innerHTML = `Salvar as mudanças ${ICON.check}`; note.textContent = 'O link e o QR code continuam os mesmos'; }
    else { nx.innerHTML = `Quero enviar · ${brl(precoTotal(S.plano, S.extras))}`; note.textContent = 'Pagamento único · Pix ou cartão · Garantia de 7 dias'; }
  } else if (S.view === 'checkout') {
    nx.disabled = ocupado; nx.innerHTML = `${ICON.lock}Pagar ${brl(precoTotal(S.plano, S.extras))}${S.pay === 'pix' ? ' com Pix' : ''}`;
    note.textContent = 'O link da carta aparece aqui assim que o pagamento cair';
  }
}

/* ----- Prévia ao vivo (desktop) ----- */
let miniTimer = null, miniCleanup = null, miniSec = null;
function schedulePreview() { clearTimeout(miniTimer); miniTimer = setTimeout(() => renderMini(false), 220); }
function renderMini(stepChanged) {
  if (!desk.matches) return;
  const m = $('#mini'), top = m.scrollTop;
  if (miniCleanup) miniCleanup();
  const L = resolveLetter(S);
  m.innerHTML = letterHTML(L, 'mini');
  const lt = m.firstElementChild; lt.style.setProperty('--cover-h', m.clientHeight + 'px');
  miniCleanup = bindLetter(m, L, 'mini');
  bindCover(m, 'mini', { onOpen() { const t = m.querySelector('#s-open'); if (t) m.scrollTo({ top: t.offsetTop - 10, behavior: 'smooth' }); } });
  const sec = S.view === 'step' ? STEPS[S.step].sec : 's-cover';
  if (stepChanged && sec !== miniSec) {
    miniSec = sec;
    const el = m.querySelector('#' + sec);
    m.scrollTop = top;
    requestAnimationFrame(() => m.scrollTo({ top: el && sec !== 's-cover' ? Math.max(0, el.offsetTop - 30) : 0, behavior: 'smooth' }));
  } else m.scrollTop = top;
}

/* ----- Arquivo de foto ----- */
function processImage(file) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const k = Math.min(1, 1440 / Math.max(img.naturalWidth, img.naturalHeight)); /* menor = o iPhone não recarrega a página ao escolher várias fotos */
      const w = Math.round(img.naturalWidth * k), h = Math.round(img.naturalHeight * k);
      const c = document.createElement('canvas'); c.width = w; c.height = h;
      const x = c.getContext('2d'); x.imageSmoothingEnabled = true; x.imageSmoothingQuality = 'high'; x.drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg', .86));
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('img')); };
    img.src = url;
  });
}
function abrirGaleria(i) {
  const inp = document.createElement('input'); inp.type = 'file'; inp.accept = 'image/*';
  inp.style.cssText = 'position:fixed;left:-9999px;top:0;width:1px;height:1px;opacity:0';
  document.body.appendChild(inp);
  let feito = false;
  const pegar = () => { if (feito) return; const f = inp.files && inp.files[0]; if (!f) return; feito = true; escolherFoto(f, i); setTimeout(() => inp.remove(), 1000); };
  inp.addEventListener('change', pegar); inp.addEventListener('input', pegar);
  setTimeout(() => { if (!feito) inp.remove(); }, 10 * 60 * 1000);
  inp.click();
}
$('#fileIn').addEventListener('change', e => { const f = e.target.files && e.target.files[0]; if (f) escolherFoto(f, +e.target.dataset.i); });
async function escolherFoto(f, i) {
  if (!f) return;
  if (!/^image\//.test(f.type) && !/\.(heic|heif)$/i.test(f.name)) { toast('Escolha uma imagem (JPG ou PNG).'); return; }
  const slot = $(`[data-add="${i}"]`); if (slot) slot.classList.add('busy');
  try { S.photos[i] = await processImage(f); savePhoto(i); save(); rerender(); }
  catch (err) { if (slot) slot.classList.remove('busy'); toast('Não conseguimos abrir essa foto. Tente outra.'); }
}

/* ----- Quem recebe: /c/<id> ----- */
async function abrirCartaRecebida(id) {
  $('#app').hidden = true; document.title = 'Uma carta para você';
  const v = $('#viewer'); v.hidden = false;
  v.innerHTML = `<div class="msg-page"><span class="seal"><span>${ICON.heartFill}</span></span><p class="sub">Abrindo a sua carta…</p></div>`;
  let j = null;
  for (let t = 0; t < 3 && !j; t++) {
    try { const r = await fetch(API + '/carta?id=' + encodeURIComponent(id), { cache: 'no-store' }); const x = await r.json().catch(() => ({})); if (r.ok) j = x; else if (r.status === 404) break; } catch (e) {}
    if (!j) await new Promise(ok => setTimeout(ok, 1500));
  }
  if (j && j.bloqueada) return telaEspera(j);
  if (j && j.expirada) {
    v.innerHTML = `<div class="msg-page"><span class="seal"><span>${ICON.heartFill}</span></span><h1 class="h1">${j.p ? 'Uma carta para ' + esc(String(j.p).slice(0, 40)) : 'Esta carta'}</h1><p class="sub">Esta carta foi feita na versão Padrão, que fica no ar por 3 meses, e esse prazo acabou.</p><a class="btn btn-primary" href="/">Fazer uma carta</a></div>`;
    return;
  }
  if (!j || !j.carta) {
    v.innerHTML = `<div class="msg-page"><span class="seal"><span>${ICON.heartFill}</span></span><h1 class="h1">Não encontramos esta carta</h1><p class="sub">Confira se o link está completo. Se a carta acabou de ser paga, espere um minutinho e abra de novo.</p><a class="btn btn-primary" href="/">Conhecer a ${BRAND}</a></div>`;
    return;
  }
  const L = cartaDoServidor(j.carta);
  const abrir = () => openViewer(L, { mode: 'recipient', onMake: () => { location.href = '/'; }, onClose: abrir });
  abrir();
}
/* cartas antigas podiam ter dia marcado para abrir */
function telaEspera(j) {
  const alvo = Date.parse(j.ab), nome = String(j.p || '').slice(0, 40), de = String(j.d || '').slice(0, 40);
  $('#viewer').innerHTML = `<div class="msg-page"><span class="seal"><span>${ICON.heartFill}</span></span><h1 class="h1">${nome ? 'Uma carta para ' + esc(nome) : 'Uma carta para você'}</h1>
    <p class="sub">Ela foi preparada com carinho e só pode ser aberta em ${esc(longDate(new Date(alvo)))}.</p><p class="countdown" id="cdown"></p>${de ? `<p class="sub">Com carinho, ${esc(de)}</p>` : ''}</div>`;
  const tic = () => {
    let r = alvo - Date.now(); if (r <= 0) return location.reload();
    const d = Math.floor(r / 864e5); r %= 864e5; const h = Math.floor(r / 36e5); r %= 36e5;
    $('#cdown').textContent = `${d ? d + (d === 1 ? ' dia ' : ' dias ') : ''}${pad(h)}:${pad(Math.floor(r / 6e4))}:${pad(Math.floor(r % 6e4 / 1e3))}`;
  };
  tic(); setInterval(tic, 1000);
}

/* ----- Início ----- */
function iniciarCriador() {
  $('#backBtn').innerHTML = ICON.back;
  $('#eyeBtn').innerHTML = ICON.eye;
  $('#nextBtn').addEventListener('click', next);
  $('#barPrem').addEventListener('click', querPremiumDosAdicionais);
  $('#backBtn').addEventListener('click', back);
  $('#eyeBtn').addEventListener('click', () => openPreview(S.view === 'ready' || S.step === ultimoPasso()));
  $('#brandBtn').addEventListener('click', () => { if (S.view === 'done') return; if (ui.acesso) { sairAcesso(); render('back'); return; } ui.editando = false; go(0, 'back'); });
  /* /meuacesso: entrou pelo endereço ou a carta deste aparelho já está paga */
  if (rotaAcessoUrl() || S.view === 'done') { ui.acesso = true; if (!rotaAcessoUrl()) { try { history.replaceState(null, '', '/meuacesso'); } catch (e) {} } carregarAcesso(); }
  window.addEventListener('popstate', () => {
    const a = rotaAcessoUrl();
    if (a && !ui.acesso) { ui.acesso = true; carregarAcesso(); render('fwd'); }
    else if (!a && ui.acesso) { ui.acesso = false; acesso.novo = null; if (S.view === 'done') resetDraft(); else render('back'); }
  });
  desk.addEventListener ? desk.addEventListener('change', () => renderMini(true)) : desk.addListener(() => renderMini(true));
  window.addEventListener('resize', () => { const m = $('#mini'), lt = m && m.firstElementChild; if (lt && desk.matches) lt.style.setProperty('--cover-h', m.clientHeight + 'px'); });
  render(null);
  /* fotos guardadas no IndexedDB chegam depois do primeiro desenho da tela */
  Promise.all([...Array(NFOTOS).keys()].map(i => fotosDB.pegar(i).catch(() => null))).then(fs => {
    let mudou = false;
    fs.forEach((f, i) => { if (f && f !== S.photos[i]) { S.photos[i] = f; mudou = true; } });
    if (mudou) rerender();
    fs.forEach((f, i) => { if (typeof f === 'string' && f.length > 900000) fetch(f).then(r => r.blob()).then(processImage).then(d => { if (S.photos[i] === f) { S.photos[i] = d; savePhoto(i); } }).catch(() => {}); });
  });
  /* volta do cartão (Mercado Pago manda para /?pedido=<id>) ou Pix ainda esperando */
  let q = null; try { q = new URLSearchParams(location.search).get('pedido'); } catch (e) {}
  if (q) { try { history.replaceState(null, '', location.pathname); } catch (e) {} }
  if (q && !(pedido && pedido.id === q)) { const ant = store.get('cd_pedido'); if (ant && ant.id === q && ant.chave) { pedido = { id: ant.id, chave: ant.chave, pago: false }; store.set(PED, pedido); } } // compra começada no site antigo
  if (pedido && !pedido.pago) {
    if (q === pedido.id) openSheet(`<p class="eyebrow">Cartão de crédito</p><h2 class="h2">Conferindo o seu pagamento</h2><div class="waiting"><span class="spin"></span>Aguardando a confirmação do Mercado Pago</div><p class="hint pix-note">Se o pagamento não foi aprovado, feche este aviso e tente de novo.</p>`);
    esperarPagamento(0);
  }
}
const rotaCarta = location.pathname.match(/\/c\/([A-Za-z0-9_-]{8,40})\/?$/);
if (rotaCarta) abrirCartaRecebida(rotaCarta[1]); else iniciarCriador();
</script>
