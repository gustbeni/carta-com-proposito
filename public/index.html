.cam-led{animation:bulb 1.4s ease-in-out infinite}
.cam-btn{transform-box:fill-box;transform-origin:50% 100%}
.cam-flash{position:absolute;left:7.8%;top:-13%;width:30%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,#fff 0,rgba(255,246,214,.9) 26%,rgba(255,236,190,0) 70%);opacity:0;transform:scale(.3);pointer-events:none}
.lt[data-mode="full"] .cam-wrap.shot .camera{animation:camShot .7s var(--ease)}
.lt[data-mode="full"] .cam-wrap.shot .cam-btn{animation:btnPress .3s ease}
.lt[data-mode="full"] .cam-wrap.shot .cam-flash{animation:camFlash 1s ease-out}
@keyframes camShot{0%{transform:none}18%{transform:scale(.95) rotate(-2deg)}45%{transform:scale(1.03) rotate(1deg)}100%{transform:none}}
@keyframes btnPress{50%{transform:translateY(4px) scaleY(.7)}}
@keyframes camFlash{0%{opacity:0;transform:scale(.3)}15%{opacity:1;transform:scale(1.4)}100%{opacity:0;transform:scale(3.2)}}
.screen-flash{position:absolute;inset:0;z-index:9;background:#FFF8E8;pointer-events:none;animation:screenFlash .9s ease-out forwards}
@keyframes screenFlash{0%{opacity:0}12%{opacity:.92}100%{opacity:0}}
.cam-out{position:relative;z-index:1;display:grid;grid-template-rows:0fr;width:min(84cqw,334px);margin-top:-14px;transition:grid-template-rows 1.7s cubic-bezier(.3,.6,.3,1) .3s}
.cam-wrap.shot .cam-out{grid-template-rows:1fr}
.cam-slide{min-height:0;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end}
.cam-pol{margin:0;background:#FFF9EE;padding:10px 10px 0;border-radius:2px;box-shadow:0 0 0 1px rgba(236,193,107,.45),0 2px 4px rgba(0,0,0,.3),0 24px 36px -20px rgba(0,0,0,.85);rotate:-1.5deg}
.cp-img{position:relative;overflow:hidden;border-radius:1px;background:#1E1A26}
.cp-img img{width:100%;aspect-ratio:4/5;object-fit:cover;filter:brightness(.15) sepia(.9) hue-rotate(170deg) saturate(.4) blur(2.5px);transition:filter 4s cubic-bezier(.4,.1,.4,1)}
.cp-veil{position:absolute;inset:0;background:radial-gradient(70% 60% at 40% 40%,rgba(60,50,80,.6),rgba(26,22,36,.95));transition:opacity 3.4s ease .4s}
.cam-wrap.dev .cp-img img{filter:none}
.cam-wrap.dev .cp-veil{opacity:0}
.cam-pol figcaption{min-height:48px;padding:12px 8px 15px;font:italic 400 17px/1.3 var(--f-text);color:#5B3B44;opacity:0;transition:opacity 1s ease 3s}
.cam-wrap.dev .cam-pol figcaption{opacity:1}
.cam-hint{margin:18px 0 0;font:italic 400 17px/1.4 var(--f-text);color:var(--ink-l2);animation:breathe 2.4s ease-in-out infinite}
.cam-wrap.shot .cam-hint{display:none}

/* Pergunta final */
.ask{position:relative;overflow:hidden;padding:40px 22px 36px;border-radius:28px;background:radial-gradient(120% 90% at 50% 0%,#A3305F 0%,#6A1440 55%,#3E0A26 100%);border:1px solid rgba(236,193,107,.55);color:#FBEBD8;box-shadow:inset 0 0 0 5px rgba(236,193,107,.08),0 30px 60px -30px rgba(0,0,0,.85)}
.ask-k{margin:0 -.3em;padding:0 .4em;font:400 52px/1.15 var(--f-script)}
.ask h3{margin:6px 0 0;font:600 clamp(30px,9cqw,38px)/1.12 var(--f-display);color:#FFF1D6;text-wrap:balance}
.ask-btns{position:relative;display:flex;justify-content:center;align-items:center;gap:12px;margin-top:28px;min-height:60px}
.ask-yes{height:54px;padding:0 34px;border-radius:999px;background:var(--gold-btn);color:#4A0F2E;font:700 16px/1 var(--f-ui);box-shadow:0 10px 24px -10px rgba(236,180,80,.8)}
.ask-no{height:44px;padding:0 20px;border-radius:999px;border:1px solid rgba(255,236,214,.45);color:#FBEBD8;font:600 14px/1 var(--f-ui);transition:transform .35s var(--ease)}
.ask-done{margin-top:26px;display:flex;flex-direction:column;align-items:center;gap:16px}
.ask-done b{font:600 26px/1.2 var(--f-display)}
.hp{position:absolute;left:50%;top:60%;width:15px;height:15px;pointer-events:none;color:#FFD27A;animation:hp 1.6s var(--ease) forwards}
.hp:nth-child(odd){color:#FF94B6}
.hp svg{width:100%;height:100%}
@keyframes hp{0%{transform:translate(-50%,-50%) scale(.4);opacity:1}100%{transform:translate(calc(-50% + var(--tx)),calc(-50% + var(--ty))) scale(var(--sc)) rotate(var(--r));opacity:0}}

/* Despedida */
.l-closing{padding-bottom:20px}
.l-close{margin:26px 0 0;font:italic 400 20px/1.3 var(--f-text);color:var(--ink-l2)}
.l-sign{margin:6px -.3em 0;padding:0 .4em;font:400 clamp(76px,24cqw,104px)/1.15 var(--f-script);overflow-wrap:anywhere;filter:drop-shadow(0 0 14px rgba(255,190,90,.32))}
.l-actions{display:flex;flex-direction:column;align-items:center;gap:10px;margin-top:30px}
.l-btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;height:52px;padding:0 26px;border-radius:999px;background:var(--gold-btn);color:#4A0F2E;font:600 15.5px/1 var(--f-ui);text-decoration:none;white-space:nowrap;box-shadow:0 12px 26px -12px rgba(236,180,80,.7),inset 0 1px 0 rgba(255,255,255,.55)}
.l-btn svg{width:19px;height:19px}
.l-btn.ghost{background:transparent;color:#F3D58A;border:1px solid rgba(236,193,107,.5);box-shadow:none}
.l-btn.light{background:#FFF6E2;color:#6A1440}
.l-credit{display:flex;flex-direction:column;align-items:center;gap:8px;margin-top:46px;padding-top:26px;border-top:1px solid var(--line-l);font:500 12.5px/1.4 var(--f-ui);color:var(--ink-l3)}
.l-credit .row{display:flex;align-items:center;gap:8px}
.l-credit .seal{--s:18px}
.l-credit small{font-size:10.5px;line-height:1.45;max-width:36ch}
.l-credit button{font:600 12.5px/1 var(--f-ui);color:var(--acc);text-decoration:underline;text-underline-offset:3px}

@container (max-width:360px){
  .l-label{letter-spacing:.18em;gap:10px}
  .l-label::before,.l-label::after{width:14px}
}

/* Carta passo a passo: cada parte espera a anterior (só na carta aberta) */
.lt[data-mode="full"] .lsec.wait{display:none}
.lt[data-mode="full"] .lsec.pre{opacity:0}
.lt[data-mode="full"] .lsec.in{animation:stepIn 1.1s var(--ease) both}
@keyframes stepIn{0%{opacity:0;transform:translateY(30px) scale(.98);filter:blur(8px)}100%{opacity:1;transform:none;filter:none}}
.lt[data-mode="full"] .lsec.in::after{content:"";position:absolute;top:0;bottom:0;left:0;width:60%;background:linear-gradient(100deg,rgba(255,226,150,0),rgba(255,226,150,.16),rgba(255,226,150,0));transform:translateX(-110%) skewX(-12deg);animation:sweep 1.8s .35s var(--ease) forwards;pointer-events:none}
@keyframes sweep{to{transform:translateX(260%) skewX(-12deg)}}
.lt[data-mode="full"] .lsec.in .pol{animation:polIn 1s var(--ease) both,polSway 5.2s ease-in-out 1s infinite}
.lt[data-mode="full"] .lsec.in .pol:nth-child(2){animation-delay:.45s,1.45s;animation-duration:1s,6s}
.lt[data-mode="full"] .lsec.in .pol:nth-child(3){animation-delay:.9s,1.9s;animation-duration:1s,5.6s}
@keyframes polIn{0%{opacity:0;transform:translateY(-44px) scale(1.12)}60%{opacity:1}100%{opacity:1;transform:none}}
.l-next-wrap{display:flex;justify-content:center;margin-top:32px}
.l-next{display:inline-flex;align-items:center;gap:8px;height:48px;padding:0 24px;border-radius:999px;background:linear-gradient(180deg,rgba(255,226,160,.18),rgba(236,193,107,.07));border:1px solid rgba(236,193,107,.6);color:#F7DE9C;font:600 14.5px/1 var(--f-ui);letter-spacing:.06em;animation:nextIn .7s var(--ease) both,nextPulse 2.4s ease-in-out .7s infinite}
.l-next svg{width:18px;height:18px;animation:nudge 1.6s ease-in-out infinite}
@keyframes nextIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes nextPulse{0%,100%{box-shadow:0 0 0 0 rgba(236,193,107,.4)}50%{box-shadow:0 0 0 11px rgba(236,193,107,0)}}
@keyframes nudge{0%,100%{transform:translateY(0)}50%{transform:translateY(3px)}}
.l-skip{display:flex;align-items:center;gap:6px;margin:18px auto 0;height:40px;padding:0 18px;border-radius:999px;background:rgba(236,193,107,.16);border:1px dashed rgba(236,193,107,.75);color:#F7DE9C;font:600 13.5px/1 var(--f-ui);letter-spacing:.04em;position:relative;z-index:3}
.l-skip svg{width:16px;height:16px;transform:rotate(-90deg)}
.l-skip:active{transform:scale(.97)}
.lsec.written .l-skip,.cine-photos.cs-fim .l-skip{display:none}
.rain{position:absolute;inset:0;z-index:5;overflow:hidden;pointer-events:none}
.rain i{position:absolute;top:-30px;left:var(--x);width:var(--s);height:var(--s);background:var(--c);-webkit-mask:var(--heart) center/contain no-repeat;mask:var(--heart) center/contain no-repeat;animation:fall var(--du) linear var(--dl) forwards}
.rain i.st{-webkit-mask:none;mask:none;clip-path:var(--star)}
@keyframes fall{0%{transform:translate(0,0) rotate(0);opacity:0}10%{opacity:1}100%{transform:translate(var(--dx),110vh) rotate(var(--r));opacity:.2}}

/* Prévia ao vivo dentro do celular */
.lt[data-mode="mini"] .lb{padding:48px 22px 40px}
.lt[data-mode="mini"] .cv{padding-top:70px}
.lt[data-mode="mini"] .jar{width:min(84cqw,320px)}
.lt[data-mode="mini"] .wheel-stage{width:min(86cqw,320px)}

/* ---------- Visualizador em tela cheia ---------- */
.viewer{position:fixed;inset:0;z-index:100;background:radial-gradient(110% 60% at 50% 0%,var(--bg3) 0%,var(--bg1) 42%,var(--bg2) 100%) var(--bg2);color:var(--ink-l)}
.vw-fx{position:absolute;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.vw-fx::before{content:"";position:absolute;inset:-25%;background:radial-gradient(30% 22% at 25% 30%,rgba(255,200,120,.12),transparent 70%),radial-gradient(26% 20% at 75% 70%,rgba(255,120,170,.10),transparent 70%);animation:drift 22s ease-in-out infinite alternate}
.vw-scroll{position:absolute;inset:0;z-index:1;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.vw-scroll.locked{overflow:hidden}
.vw-scroll > .lt{min-height:100%}
.vw-scroll.has-bar .lb{padding-bottom:140px}
.vw-cover{position:absolute;inset:0;z-index:3;overflow:hidden;transition:opacity .8s ease}
.vw-cover .cv{min-height:100%;height:100%}
.vw-cover.gone{opacity:0;pointer-events:none}
.vw-top{position:absolute;z-index:6;top:calc(12px + env(safe-area-inset-top,0px));left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));display:flex;align-items:center;gap:8px;pointer-events:none}
.vw-top > *{pointer-events:auto}
.vw-sp{flex:1}
.pill{display:inline-flex;align-items:center;gap:7px;height:40px;padding:0 15px 0 12px;border-radius:999px;background:rgba(30,6,24,.55);border:1px solid rgba(236,193,107,.32);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);font:600 13px/1 var(--f-ui);color:#F6E3B4;text-decoration:none;white-space:nowrap}
.pill svg{width:16px;height:16px}
.pill-tag{padding:0 12px;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--rubric)}
.eq{display:inline-flex;align-items:flex-end;gap:2px;width:14px;height:13px}
.eq i{width:3px;height:45%;border-radius:2px;background:currentColor}
.eq i:nth-child(2){height:90%}
.eq i:nth-child(3){height:62%}
.pill[aria-pressed="true"] .eq i{animation:eq 1s ease-in-out infinite}
.pill[aria-pressed="true"] .eq i:nth-child(2){animation-delay:-.35s}
.pill[aria-pressed="true"] .eq i:nth-child(3){animation-delay:-.7s}
@keyframes eq{0%,100%{height:30%}50%{height:100%}}
.vw-bottom{position:absolute;z-index:6;left:0;right:0;bottom:0;display:flex;justify-content:center;padding:22px var(--gut-r) calc(14px + env(safe-area-inset-bottom,0px)) var(--gut);background:linear-gradient(to top,rgba(26,5,20,.96) 62%,rgba(26,5,20,0));transition:opacity .5s,transform .5s var(--ease)}
.vw-bottom.wait{opacity:0;transform:translateY(20px);pointer-events:none}
.vw-bottom-in{display:flex;gap:10px;width:100%;max-width:480px}
.lightbox{position:absolute;inset:0;z-index:8;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;background:rgba(14,3,11,.9);animation:fade .25s ease;cursor:zoom-out}
.lightbox img{max-height:76vh;width:auto;border-radius:4px;box-shadow:0 30px 60px -20px rgba(0,0,0,.7)}
.lightbox p{margin:0;font:italic 400 18px/1.3 var(--f-text);color:#F6E3B4;text-align:center}
.mbox{width:100%;max-width:420px;margin:14px auto 0;border-radius:16px;overflow:hidden;background:rgba(0,0,0,.25);border:1px solid var(--line-l);box-shadow:0 0 30px -10px rgba(255,190,90,.35)}
.mbox.yt{aspect-ratio:16/9}
.mbox iframe{display:block;width:100%;height:100%;border:0}
.mbox.sp{min-height:152px}
.som-btn{margin-top:14px}
.mdock{position:fixed;left:0;bottom:0;width:200px;height:113px;opacity:.01;pointer-events:none;z-index:0;overflow:hidden}
.mdock iframe{width:200px;height:113px;border:0}
.som-flut{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 150px);z-index:45;margin:0;transform:translateX(-50%);white-space:nowrap;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.msg-page{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:40px var(--gut);text-align:center}
.msg-page .seal{--s:64px}
.msg-page .sub{max-width:34ch}
.countdown{font:600 34px/1.1 var(--f-display);font-variant-numeric:tabular-nums;color:var(--rubric);margin:6px 0}

/* ---------- Desktop ---------- */
@media (min-width:1040px){
  .layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:48px;align-items:start;padding-inline:40px}
  .builder{display:flex;flex-direction:column;min-height:calc(100vh - 60px);padding:52px 0 0}
  .nobar .builder{padding-bottom:48px}
  .screen{flex:1;width:100%}
  .bar{position:sticky;bottom:0;margin-top:28px;padding-inline:0}
  .bar .eye{display:none}
  .ready{display:none}
  .ready-desk{display:inline-flex}
  .live{display:flex;flex-direction:column;align-items:center;gap:16px;position:sticky;top:60px;height:calc(100vh - 60px);padding-block:26px 22px;justify-content:center}
  .live-label{margin:0;display:flex;align-items:center;gap:8px;font:600 11px/1 var(--f-ui);letter-spacing:.18em;text-transform:uppercase;color:var(--ink-3)}
  .live-label::before{content:"";width:7px;height:7px;border-radius:50%;background:#F3D58A;box-shadow:0 0 0 3px rgba(243,213,138,.2),0 0 10px rgba(243,213,138,.8)}
  .live-hint{margin:0;font-size:12.5px;color:var(--ink-3)}
  .phone{position:relative;height:min(780px,calc(100vh - 150px));aspect-ratio:9/18.6;padding:11px;border-radius:52px;background:#14040F;box-shadow:0 60px 90px -50px rgba(0,0,0,.9),0 0 60px -20px rgba(236,180,80,.25),inset 0 0 0 2px #3A2030,0 0 0 1px rgba(236,193,107,.25)}
  .phone-notch{position:absolute;top:21px;left:50%;z-index:5;width:92px;height:26px;border-radius:20px;background:#14040F;transform:translateX(-50%)}
  .phone-screen{position:relative;width:100%;height:100%;border-radius:42px;overflow:hidden;background:#2A0718;isolation:isolate}
  .mini{height:100%;overflow-y:auto;scrollbar-width:none;overscroll-behavior:contain}
  .mini::-webkit-scrollbar{display:none}
  .toast{bottom:40px}
  .sheet{align-items:center}
  .sheet-card{border-radius:28px;padding-inline:28px;border:1px solid var(--line-2)}
}
@media (max-width:360px){
  .tiles{grid-template-columns:1fr}
  .themes{gap:8px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;transition-delay:0s!important}
  .cv-motes,.cv-rays,.twinkle,.vw-fx,.glory,.quill,.fh,.screen-flash{display:none}
}

/* ======================================================================
   PACOTES: Padrão e Premium (escolha no fim) e a carta Premium
   ====================================================================== */
.ex-links{display:flex;flex-direction:column;align-items:flex-start;gap:2px;margin-top:14px}
.ex-links .ex-link{margin-top:0}
.ex-premium{color:#F7D995}
.planos{display:grid;gap:12px}
.plano{position:relative;display:block;width:100%;padding:16px 16px 14px;border-radius:20px;background:var(--card);border:1px solid var(--line);transition:border-color .2s,background-color .2s,box-shadow .2s}
.plano .pl-top{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:12px;align-items:center}
.plano .pl-t b{display:block;font:600 18px/1.2 var(--f-ui);color:var(--ink)}
.plano .pl-t small{display:block;margin-top:2px;font-size:13px;color:var(--ink-3)}
.plano strong{font:600 22px/1 var(--f-display);color:var(--rubric-2);font-variant-numeric:lining-nums}
.plano ul{list-style:none;margin:12px 0 0;padding:12px 0 0 34px;border-top:1px solid var(--line);display:grid;gap:7px}
.plano li{display:grid;grid-template-columns:16px minmax(0,1fr);gap:8px;font-size:13.5px;line-height:1.4;color:var(--ink-2)}
.plano li svg{width:15px;height:15px;color:var(--rubric);margin-top:2px}
.plano li b{color:var(--ink)}
.plano[aria-pressed="true"]{border-color:var(--rubric);background:rgba(236,193,107,.10);box-shadow:inset 0 0 0 1px var(--rubric)}
.plano.premium{background:linear-gradient(160deg,rgba(236,193,107,.16),rgba(154,42,94,.22) 60%,var(--card));border-color:rgba(236,193,107,.5)}
.plano.premium[aria-pressed="true"]{box-shadow:inset 0 0 0 1px var(--rubric),0 0 34px -8px rgba(236,193,107,.55)}
.plano.premium strong{background:var(--gold-grad);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;animation:goldShine 6s linear infinite}
.pl-badge{position:absolute;top:-10px;right:16px;padding:5px 10px;border-radius:999px;background:var(--gold-btn);color:#3A0B2B;font:700 10.5px/1 var(--f-ui);letter-spacing:.08em;text-transform:uppercase;box-shadow:0 6px 14px -6px rgba(236,180,80,.8)}
.extra{margin-top:8px;padding:2px 0 4px}
.extra .hint{margin-top:-6px}
.extra .photos{margin-top:14px}
.photos.film{position:static;inset:auto;width:auto;height:auto;z-index:auto;opacity:1;transform:none;background:none;overflow:visible;color:inherit;transition:none;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px} /* a classe "film" também é a do mini filme; aqui é só a grade de fotos */
.photos.film::after{content:none}
.photos.film .ph{padding:5px 5px 6px}
.photos.film .ph-drop{font-size:11.5px;gap:4px}
.photos.film .ph-drop svg{width:20px;height:20px}
.photos.film .ph-drop small{font-size:10px}
.plano-nota{margin:12px auto 0;max-width:34ch;font-size:14px;line-height:1.45;color:var(--rubric-2)}

/* Premium: polaroides em slides de cinema; a foto salta da polaroide 50% maior */
.cine-slides{position:relative;margin:6px -10px 0}
.cs-stage{position:relative;aspect-ratio:1/1.24;overflow:visible;cursor:pointer;-webkit-tap-highlight-color:transparent}
.cs-slide{position:absolute;inset:0;margin:0;display:grid;place-items:center;opacity:0;pointer-events:none}
.cs-pol{position:relative;width:62%;padding:9px 9px 0;background:#FFF9EE;border-radius:3px;box-shadow:0 0 0 1px rgba(236,193,107,.55),0 30px 44px -22px rgba(0,0,0,.85);rotate:-3deg}
.cs-slide:nth-child(even) .cs-pol{rotate:3deg}
.cs-img{position:relative;aspect-ratio:1;background:#EDE0CC}
.cs-img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:1px;transform-origin:50% 60%;transition:none}
.cs-pol figcaption{min-height:44px;padding:10px 4px 12px;text-align:center;font:italic 400 16px/1.25 var(--f-text);color:#5B3B44}
.cs-slide.on{opacity:1;pointer-events:auto;animation:csIn 1s cubic-bezier(.2,.8,.2,1) both}
.cs-slide.on .cs-img img{animation:csPop 3.6s cubic-bezier(.25,.8,.25,1) both}
.cs-slide.on figcaption{animation:fade .8s ease 1.3s both}
.cs-slide.sai{opacity:1;animation:csOut .9s cubic-bezier(.6,0,.4,1) forwards}
@keyframes csIn{0%{opacity:0;transform:translateX(42%) rotate(8deg) scale(.86);filter:blur(10px) brightness(1.6)}60%{filter:blur(0) brightness(1.15)}100%{opacity:1;transform:none;filter:none}}
@keyframes csOut{0%{opacity:1;transform:none;filter:none}100%{opacity:0;transform:translateX(-46%) rotate(-8deg) scale(.86);filter:blur(10px)}}
/* a foto sai da moldura: cresce 1.5x com brilho de ouro e um zoom lento de cinema */
@keyframes csPop{0%,22%{transform:none;box-shadow:none;border-radius:1px}46%{transform:translateY(-14%) scale(1.5);box-shadow:0 26px 50px -12px rgba(0,0,0,.75),0 0 0 3px rgba(255,236,190,.9),0 0 40px rgba(255,200,110,.55);border-radius:4px}100%{transform:translateY(-15%) scale(1.58);box-shadow:0 26px 50px -12px rgba(0,0,0,.75),0 0 0 3px rgba(255,236,190,.9),0 0 46px rgba(255,200,110,.6);border-radius:4px}}
.cs-leak{position:absolute;inset:-8% -20%;z-index:3;pointer-events:none;opacity:0;background:linear-gradient(100deg,rgba(255,180,90,0) 30%,rgba(255,214,150,.55) 48%,rgba(255,150,170,.35) 56%,rgba(255,180,90,0) 72%);mix-blend-mode:screen}
.cs-leak.on{animation:leak 1.1s ease-out}
@keyframes leak{0%{opacity:0;transform:translateX(-40%)}35%{opacity:1}100%{opacity:0;transform:translateX(40%)}}
.cs-bar{position:absolute;left:-6%;right:-6%;z-index:4;height:7%;background:#120310;pointer-events:none;opacity:.85;transition:height .8s ease}
.cs-bar.t{top:-2%}
.cs-bar.b{bottom:-2%}
.cs-dots{display:flex;justify-content:center;gap:7px;margin-top:6px}
.cs-dots i{width:22px;height:3px;border-radius:2px;background:rgba(240,210,160,.25);transition:background-color .4s}
.cs-dots i.on{background:linear-gradient(90deg,#F3D58A,#E2B04A)}
.cs-hint{margin:10px 0 0;font:italic 400 14px/1.3 var(--f-text);color:var(--ink-l3)}
.cine-photos:not(.cs-fim) .pols{display:none!important}
.cine-photos.cs-fim .cine-slides{display:none}
.cine-photos.cs-fim .pols{display:grid;animation:fade .9s ease both}
.pols.pols6{display:grid;grid-template-columns:1fr 1fr;gap:14px 10px;align-items:start}
.pols.pols6 .pol{width:100%;align-self:start;margin-top:0;padding:7px 7px 0}
.pols.pols6 .pol figcaption{min-height:34px;padding:7px 3px 9px;font-size:13px}
.pols.pols6 .pol::before{width:52px;height:18px;top:-8px}
.pols.pols6 .pol:nth-child(even){margin-top:18px}

/* Premium: câmera mais gloriosa (raios de ouro atrás da foto revelada) */
.cam-rays{position:absolute;left:50%;top:62%;z-index:0;width:150%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:repeating-conic-gradient(from 0deg,rgba(255,222,150,.28) 0deg 5deg,rgba(255,222,150,0) 5deg 14deg);-webkit-mask:radial-gradient(closest-side,#000 10%,transparent 72%);mask:radial-gradient(closest-side,#000 10%,transparent 72%);opacity:0;transition:opacity 1.6s ease;pointer-events:none}
.cam-wrap.premium.dev .cam-rays{opacity:1;animation:raysSpin 26s linear infinite}
.cam-wrap.premium .cam-out{z-index:1}
.cam-wrap.premium.dev .cam-pol{box-shadow:0 0 0 1px rgba(236,193,107,.6),0 0 40px rgba(255,200,110,.5),0 24px 36px -20px rgba(0,0,0,.85);transition:box-shadow 2s ease 3s}

/* Premium: cartão do mini filme */
.film-card{position:relative;display:block;width:100%;aspect-ratio:4/5;margin-top:4px;border-radius:18px;overflow:hidden;box-shadow:0 0 0 1px rgba(236,193,107,.5),0 30px 50px -24px rgba(0,0,0,.85)}
.film-card img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:brightness(.62) saturate(1.05);animation:kb0 14s ease-in-out infinite alternate}
.fc-bars::before,.fc-bars::after{content:"";position:absolute;left:0;right:0;height:9%;background:#0A0208}
.fc-bars::before{top:0}
.fc-bars::after{bottom:0}
.fc-play{position:absolute;left:50%;top:44%;width:74px;height:74px;margin:-37px;border-radius:50%;display:grid;place-items:center;background:rgba(255,246,220,.18);border:1.5px solid rgba(255,236,190,.85);color:#FFF1C4;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);animation:nextPulse 2.2s ease-in-out infinite}
.fc-play svg{width:28px;height:28px;margin-left:4px}
.fc-t{position:absolute;left:0;right:0;bottom:17%;padding:0 .3em;font:400 clamp(38px,11cqw,48px)/1.1 var(--f-script);filter:drop-shadow(0 2px 8px rgba(0,0,0,.6))}
.fc-s{position:absolute;left:0;right:0;bottom:11.5%;font:600 10.5px/1 var(--f-ui);letter-spacing:.22em;text-transform:uppercase;color:#F6E3B4}
.lsec.visto .film-note{display:none}

/* o filme em tela cheia */
.film{position:absolute;inset:0;z-index:9;background:#050104;overflow:hidden;opacity:0;transition:opacity .6s ease;color:#FBEBD8}
.film.on{opacity:1}
.film.fecha{opacity:0}
.fm-stage{position:absolute;inset:0}
.fm-shot{position:absolute;inset:0;opacity:0}
.fm-shot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.fm-shot.on{opacity:1}
.fm-shot.on.t-fade{animation:fmFade 1.2s ease both}
.fm-shot.on.t-slide{animation:fmSlide 1.1s cubic-bezier(.2,.8,.2,1) both}
.fm-shot.on.t-zoom{animation:fmZoom 1.3s cubic-bezier(.2,.8,.2,1) both}
.fm-shot.on.t-flash{animation:fmFlash 1.1s ease both}
.fm-shot.on.t-blur{animation:fmBlur 1.3s ease both}
.fm-shot.sai{opacity:1;animation:fmSai 1.3s ease forwards}
@keyframes fmFade{from{opacity:0}to{opacity:1}}
@keyframes fmSlide{from{opacity:0;transform:translateX(30%)}to{opacity:1;transform:none}}
@keyframes fmZoom{from{opacity:0;transform:scale(1.35)}to{opacity:1;transform:none}}
@keyframes fmFlash{0%{opacity:0;filter:brightness(3)}40%{opacity:1;filter:brightness(1.8)}100%{opacity:1;filter:none}}
@keyframes fmBlur{from{opacity:0;filter:blur(18px)}to{opacity:1;filter:none}}
@keyframes fmSai{to{opacity:0}}
.fm-shot.on img{animation:var(--kb) 4.6s ease-out both}
.fm-shot.kb0{--kb:kb0}.fm-shot.kb1{--kb:kb1}.fm-shot.kb2{--kb:kb2}.fm-shot.kb3{--kb:kb3}
@keyframes kb0{from{transform:scale(1.02)}to{transform:scale(1.16)}}
@keyframes kb1{from{transform:scale(1.18) translate(3%,2%)}to{transform:scale(1.04)}}
@keyframes kb2{from{transform:scale(1.12) translateX(-4%)}to{transform:scale(1.12) translateX(4%)}}
@keyframes kb3{from{transform:scale(1.1) translateY(4%)}to{transform:scale(1.18) translateY(-3%)}}
.film::after{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;background:radial-gradient(120% 80% at 50% 40%,rgba(0,0,0,0) 45%,rgba(0,0,0,.55) 100%),linear-gradient(to top,rgba(10,2,8,.85),rgba(10,2,8,0) 38%)}
.fm-bar{position:absolute;left:0;right:0;z-index:3;height:0;background:#000;transition:height 1.2s cubic-bezier(.2,.8,.2,1)}
.film.on .fm-bar{height:8%}
.fm-bar.t{top:0}
.fm-bar.b{bottom:0}
.fm-title{position:absolute;inset:0;z-index:4;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;opacity:0;pointer-events:none}
.fm-title span{font:italic 500 19px/1.3 var(--f-display);color:#EBCFA3}
.fm-title b{font:400 clamp(58px,17vw,84px)/1.1 var(--f-script);padding:0 .3em;font-weight:400}
.film.titulo .fm-title{animation:fmTit 2.8s ease both}
@keyframes fmTit{0%{opacity:0;transform:scale(.94);filter:blur(6px)}25%,72%{opacity:1;transform:none;filter:none}100%{opacity:0;transform:scale(1.04)}}
.fm-txt{position:absolute;left:24px;right:24px;bottom:calc(11% + 26px);z-index:4;margin:0;text-align:center;font:400 clamp(30px,8.6vw,40px)/1.2 var(--f-script);color:#FFF1CC;text-shadow:0 2px 14px rgba(0,0,0,.8),0 0 18px rgba(255,190,90,.4);opacity:0;transform:translateY(10px);transition:opacity .8s ease,transform .8s ease}
.fm-txt.on{opacity:1;transform:none}
.fm-prog{position:absolute;left:18px;right:18px;bottom:calc(8% + 10px);z-index:4;height:2px;border-radius:2px;background:rgba(255,236,190,.2)}
.fm-prog i{display:block;height:100%;width:0;background:#F3D58A}
.fm-x{position:absolute;top:calc(8% + 10px);right:14px;z-index:5;height:34px;padding:0 14px;border-radius:999px;background:rgba(0,0,0,.4);border:1px solid rgba(255,236,190,.4);font:600 12.5px/1 var(--f-ui);color:#F6E3B4}
.film.final .fm-x,.film.final .fm-prog{display:none}
.fm-end{position:absolute;inset:0;z-index:6;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:0 24px;text-align:center;background:radial-gradient(90% 60% at 50% 45%,rgba(122,24,64,.92),rgba(20,3,14,.97));animation:fade 1.2s ease both}
.fm-k{margin:0;font:600 11px/1.4 var(--f-ui);letter-spacing:.26em;text-transform:uppercase;color:#ECC16B}
.fm-end b{font:400 clamp(54px,15vw,76px)/1.15 var(--f-script);padding:0 .3em;font-weight:400}
.fm-d{margin:0;font:italic 600 19px/1.3 var(--f-verse);color:#FFF1CC}
.fm-v{margin:10px 0 0;font:italic 500 18px/1.4 var(--f-display);color:#EBCFA3;max-width:26ch}
.fm-btns{display:flex;flex-direction:column;align-items:center;gap:10px;margin-top:26px}

/* Premium: abertura de cinema antes da carta */
.cine-open{position:absolute;inset:0;z-index:7;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:0 22px;background:radial-gradient(80% 55% at 50% 48%,#4A0E30 0%,#1A0412 60%,#070106 100%);opacity:0;transition:opacity .7s ease}
.cine-open.on{opacity:1}
.cine-open.sai{opacity:0;transition:opacity .9s ease}
.co-dust{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.co-dust i{position:absolute;bottom:-12px;left:var(--x);width:var(--z);height:var(--z);border-radius:50%;background:rgba(255,214,130,.95);box-shadow:0 0 8px 1px rgba(255,214,130,.9);opacity:0;animation:mote var(--d) linear var(--dl) infinite}
.co-bar{position:absolute;left:0;right:0;z-index:2;height:0;background:#000;transition:height 1s cubic-bezier(.2,.8,.2,1)}
.cine-open.on .co-bar{height:11%}
.co-bar.t{top:0}
.co-bar.b{bottom:0}
.cine-open p{position:relative;margin:0;opacity:0}
.co-1{font:600 11.5px/1.5 var(--f-ui);letter-spacing:.32em;text-transform:uppercase;color:#ECC16B}
.co-2{padding:0 .3em;white-space:nowrap;font:400 clamp(60px,17vw,86px)/1.12 var(--f-script)} /* sem filter: no iPhone o filtro sobre o ouro (texto recortado) vira um borrão */
.co-2::before{content:"";position:absolute;left:8%;right:8%;top:10%;bottom:10%;z-index:-1;border-radius:50%;background:radial-gradient(closest-side,rgba(255,190,90,.28),rgba(255,190,90,0));pointer-events:none}
.co-2 span{display:inline-block;padding:0 .3em;margin:0 -.3em}
/* nomes em ouro sólido com brilho (sem texto recortado, que o iPhone borra nesta animação) */
.co-nome{color:#F3D08A;-webkit-text-fill-color:#F3D08A;text-shadow:0 1px 0 #FFF2C8,0 2px 0 #B8862F,0 3px 2px rgba(70,30,0,.55),0 0 24px rgba(255,190,90,.55)}
.co-3{font:italic 600 19px/1.3 var(--f-verse);color:#FFF1CC;white-space:nowrap}
.cine-open.on .co-1{animation:coIn 1.4s ease .5s both}
.cine-open.on .co-2{animation:coName 2.4s cubic-bezier(.2,.8,.2,1) 1.6s both}
.cine-open.on .co-3{animation:coIn 1.4s ease 3s both}
@keyframes coIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}} /* sem mexer no espaçamento: ele fazia o texto quebrar de linha no meio da animação */
@keyframes coName{0%{opacity:0;transform:scale(1.25)}100%{opacity:1;transform:none}}
.co-flare{position:absolute;left:50%;top:50%;z-index:3;width:140vmax;height:140vmax;margin:-70vmax;border-radius:50%;background:radial-gradient(circle,rgba(255,250,230,.95) 0%,rgba(255,220,150,.6) 12%,rgba(255,200,110,0) 45%);opacity:0;pointer-events:none}
.cine-open.on .co-flare{animation:coFlare 1.6s ease-out 5.4s both}
@keyframes coFlare{0%{opacity:0;transform:scale(.1)}45%{opacity:1}100%{opacity:0;transform:scale(1.2)}}
.co-skip{position:absolute;right:14px;bottom:calc(11% + 14px);z-index:4;height:34px;padding:0 14px;border-radius:999px;background:rgba(0,0,0,.35);border:1px solid rgba(255,236,190,.35);font:600 12.5px/1 var(--f-ui);color:#F6E3B4}
@media (prefers-reduced-motion:reduce){
  .cs-slide.on .cs-img img{animation:none;transform:translateY(-15%) scale(1.5)}
  .co-dust,.co-flare{display:none}
}
.plano[aria-pressed="true"] .radio{background:var(--gold-btn);border-color:#F3D58A}
.plano[aria-pressed="true"] .radio::after{content:"";width:9px;height:5px;border:2px solid #3A0B2B;border-top:0;border-right:0;transform:translateY(-1px) rotate(-45deg)}

/* Busca da música pelo nome (sugestões do YouTube) */
.busca{display:flex;flex-direction:column;gap:8px}
.sugs-yt{display:flex;flex-direction:column;gap:6px}
.sugs-yt:empty{display:none}
.sug-yt{display:grid;grid-template-columns:64px minmax(0,1fr) 18px;gap:12px;align-items:center;width:100%;padding:6px 10px 6px 6px;border-radius:14px;background:var(--card);border:1px solid var(--line);transition:border-color .2s,background-color .2s}
.sug-yt img,.sug-yt .sug-img{width:64px;height:48px;border-radius:9px;object-fit:cover;background:rgba(255,236,214,.08)}
.sug-yt b{display:block;font:600 13.5px/1.3 var(--f-ui);color:var(--ink);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.sug-yt small{display:block;margin-top:2px;font-size:12px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sug-yt svg{width:18px;height:18px;color:var(--rubric)}
.sug-yt:hover{border-color:var(--line-2)}
.sug-yt.on{border-color:var(--rubric);background:rgba(236,193,107,.10);box-shadow:inset 0 0 0 1px var(--rubric)}
.sug-msg{display:flex;align-items:center;gap:8px;margin:2px 0;font-size:13.5px;color:var(--ink-3)}
.busca-ou{margin:4px 0 -2px}

/* Prévia de exemplo: aviso para rolar a tela */
.vw-dica{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 98px);z-index:30;display:flex;align-items:center;gap:8px;padding:9px 16px;border-radius:999px;background:rgba(30,6,24,.78);border:1px solid rgba(236,193,107,.45);color:#F7DE9C;font:600 13px/1 var(--f-ui);letter-spacing:.02em;white-space:nowrap;transform:translateX(-50%);pointer-events:none;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);animation:dicaIn .6s var(--ease) both}
.vw-dica svg{width:16px;height:16px;animation:nudge 1.4s ease-in-out infinite}
@keyframes dicaIn{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translateX(-50%)}}

/* Meu acesso (/meuacesso) */
body.na-acesso .live{display:none!important}
@media (min-width:1040px){body.na-acesso .layout{display:block}}
.ja-comprou{margin:22px 0 0;font-size:14px;color:var(--ink-3)}
.ja-comprou .link{display:inline;padding:0}
.ace-mail{margin-top:18px;text-align:left}
.ace-form{display:grid;gap:14px;margin-top:24px}
.ace-quem{margin:20px 0 0;text-align:center;font-size:14px;line-height:1.5;color:var(--ink-3)}
.ace-quem b{color:var(--ink-2);font-weight:600;overflow-wrap:anywhere}
.ace-quem .link{display:inline;padding:0;font-size:14px}
.ace-erro{text-align:center}
.ace-erro .link{display:inline;padding:0;font-size:13px}
.ace-vazio{margin:22px 0 0;padding:18px;border-radius:16px;background:var(--card);border:1px solid var(--line);text-align:center;font-size:14.5px;line-height:1.5;color:var(--ink-2)}
.ace-lista{display:grid;gap:20px;margin-top:22px}
.ace-card{display:grid;gap:12px;padding:18px;border-radius:22px;background:linear-gradient(180deg,rgba(255,226,160,.07),rgba(255,226,160,.02));border:1px solid rgba(236,193,107,.32);box-shadow:0 24px 40px -30px rgba(0,0,0,.8)}
.ace-top{display:flex;align-items:center;gap:14px}
.ace-top .seal{--s:48px;flex:none}
.ace-para{margin:0 -.2em;padding:0 .2em;font:400 38px/1.15 var(--f-script);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ace-occ{margin:2px 0 0;font-size:13.5px;line-height:1.4;color:var(--ink-3)}

.prem-lista{display:grid;gap:10px;margin:22px 0 0;padding:16px;list-style:none;border-radius:20px;background:linear-gradient(180deg,rgba(255,226,160,.1),rgba(255,226,160,.03));border:1px solid rgba(236,193,107,.4);box-shadow:0 0 40px -18px rgba(255,200,110,.45)}

.prem-lista svg{width:20px;height:20px;margin-top:2px;color:var(--rubric)}
.prem-lista b{display:block;font:600 15.5px/1.3 var(--f-ui);color:var(--ink)}
.prem-lista small{display:block;margin-top:2px;font-size:13.5px;line-height:1.45;color:var(--ink-3)}
.prem-ver{margin:14px auto 0;display:flex}
.prem-ver svg{width:18px;height:18px}
.prem-acoes{display:grid;gap:12px;margin-top:18px}
.prem-acoes .btn{height:auto;min-height:56px;padding-block:12px;white-space:normal;line-height:1.25}
.plano-escolhido{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:22px;padding:14px 16px;border-radius:16px;background:var(--card);border:1px solid var(--line)}
.plano-escolhido.premium{border-color:rgba(236,193,107,.55);box-shadow:0 0 30px -14px rgba(255,200,110,.5)}

.plano-escolhido .link{flex:none;padding:6px 0}

/* adicionais da carta Padrão (order bump) */
.bumps{margin:18px 0 6px;padding:16px;border-radius:18px;background:var(--card);border:1px solid var(--line)}
.bumps-t{display:flex;align-items:center;gap:8px;margin:0 0 10px;font:600 15px/1.3 var(--f-ui);color:var(--ink)}
.bumps-t svg{width:18px;height:18px;color:#F3D58A}
.bump{position:relative;display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 12px;margin-top:8px;border-radius:14px;border:1px solid var(--line);cursor:pointer;transition:border-color .2s,background-color .2s}

    BARS.forEach((c, i) => {

function numbersHTML(L, C, ph) {
  const st = L.stats, num = k => ph ? '—' : fmt(st[k]);
  const ic = { hours: CLOCK_IC, nights: MOON_IC, years: HOURGLASS, weeks: ICON.calendar };

  const hearts = Array.from({ length: 7 }, (_, i) => `<i class="fh" style="--x:${8 + i * 13}%;--d:${(i * .9).toFixed(1)}s;--s:${10 + (i % 3) * 5}px"></i>`).join('');
  return `<p class="l-label">${esc(C.numbersLabel)}</p>
    <div class="since">${ph ? '<span class="since-d">Escolha a data para ver a história de vocês em números</span>' : `<span class="since-k gold-t">${esc(C.since)}</span><span class="since-d">${esc(longDate(parseISO(L.date)))}${esc(C.sinceSuffix || '')}</span>`}</div>

      <svg class="hc-hand" viewBox="0 0 200 200" aria-hidden="true"><path d="M100 100V22" stroke="#F6DB92" stroke-width="1.4" stroke-linecap="round"/><path d="M100 26C96 22 95 18 97.5 16.5 99 15.6 100 16.6 100 18 100 16.6 101 15.6 102.5 16.5 105 18 104 22 100 26Z" fill="#FF8FB1"/><circle cx="100" cy="100" r="3" fill="#F6DB92"/></svg>
      <svg class="hc-heart" viewBox="-20 -18 40 36" aria-hidden="true"><path d="${HEART_PATH}" transform="translate(0 2) scale(1.55)" fill="rgba(176,36,78,.28)" stroke="#F3D58A" stroke-width=".7"/></svg>
      <div class="hc-num"><b class="l-big gold-t" data-count="${ph ? 0 : st.days}">${num('days')}</b></div>
      ${ph ? '' : hearts}
    </div>
    <div class="l-bigl">${esc(C.big)}</div>
    ${ph ? '' : `<div class="l-tick">${HOURGLASS}<span>e contando · <span data-tick="${L.date}">${clockSince(L.date)}</span></span></div>`}
    <div class="l-rows">${C.rows.map(([k, label]) => `<div class="l-row"><span class="r-ic">${ic[k] || CLOCK_IC}</span><b class="gold-t" data-count="${ph ? 0 : st[k]}">${num(k)}</b><span class="r-l">${esc(label)}</span></div>`).join('')}</div>`;
}

  return `<svg class="cam-svg" viewBox="0 0 320 210" aria-hidden="true"><defs>
    <linearGradient id="cm${u}a" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5A382A"/><stop offset=".5" stop-color="#3A2219"/><stop offset="1" stop-color="#241410"/></linearGradient>
    <linearGradient id="cm${u}b" x1="0" x2="1"><stop offset="0" stop-color="#9A6820"/><stop offset=".25" stop-color="#F6D98C"/><stop offset=".5" stop-color="#C9943B"/><stop offset=".75" stop-color="#FBE6A6"/><stop offset="1" stop-color="#A06C22"/></linearGradient>
    <radialGradient id="cm${u}c" cx=".38" cy=".34" r=".85"><stop offset="0" stop-color="#8A73C9"/><stop offset=".35" stop-color="#3B2557"/><stop offset=".7" stop-color="#140C1F"/><stop offset="1" stop-color="#05030A"/></radialGradient>

    <pattern id="cm${u}p" width="5" height="5" patternUnits="userSpaceOnUse"><circle cx="2.5" cy="2.5" r=".9" fill="rgba(0,0,0,.28)"/></pattern></defs>
    <g class="cam-top">

    <rect x="8" y="58" width="304" height="144" rx="24" fill="url(#cm${u}a)"/>
    <rect x="8" y="58" width="304" height="144" rx="24" fill="url(#cm${u}p)"/>
    <rect x="8" y="68" width="304" height="5" fill="url(#cm${u}b)" opacity=".9"/><rect x="8" y="184" width="304" height="4" fill="url(#cm${u}b)" opacity=".9"/>
    <circle class="cam-led" cx="40" cy="96" r="4.5" fill="#FF5A5A"/>
    <circle cx="160" cy="128" r="62" fill="url(#cm${u}d)" stroke="#5A3A10" stroke-width="1.5"/>
    <circle cx="160" cy="128" r="53" fill="#140D18" stroke="#E9C46A" stroke-width="1.2"/>${marks}
    <circle cx="160" cy="128" r="39" fill="url(#cm${u}c)"/>
    <circle cx="160" cy="128" r="21" fill="#07040C" stroke="rgba(255,255,255,.1)"/>
    <g class="cam-glint"><path d="M131 106A40 40 0 0 1 168 92" stroke="#fff" stroke-width="5" stroke-linecap="round" opacity=".55" fill="none"/><circle cx="175" cy="112" r="4" fill="#fff" opacity=".75"/></g>
    <rect x="66" y="193" width="188" height="7" rx="3.5" fill="#0D0705"/>

}
function cameraHTML(L, mini) {
  const cap = L.captions[3];
  return `<div class="cam-wrap${mini ? ' shot dev' : ''}${L.premium ? ' premium' : ''}">${L.premium ? '<i class="cam-rays" aria-hidden="true"></i>' : ''}
    <button class="camera" aria-label="Tirar e revelar a última foto">${cameraSVG(++svgUid)}<span class="cam-flash" aria-hidden="true"></span></button>
    <div class="cam-out"><div class="cam-slide"><figure class="cam-pol"><div class="cp-img"><img src="${L.photos[3]}" alt="${esc(cap || 'Foto')}"><i class="cp-veil"></i></div><figcaption>${cap ? esc(cap) : '&nbsp;'}</figcaption></figure></div></div>
    <p class="cam-hint">Toque na câmera para revelar a foto</p>

}

    <div class="cs-stage">${pics.map((p, i) => `<figure class="cs-slide" data-k="${i}"><div class="cs-pol"><div class="cs-img"><img src="${p.src}" alt="${esc(p.cap || 'Foto')}"></div><figcaption>${esc(p.cap || '')}</figcaption></div></figure>`).join('')}
      <i class="cs-leak" aria-hidden="true"></i></div>
    <div class="cs-dots" aria-hidden="true">${pics.map(() => '<i></i>').join('')}</div>
    <p class="cs-hint">Toque na foto para passar</p>
  </div>`;
}

const FRASES_FILME = {
  amor: ['Tudo começou com um olhar…', 'E Deus foi escrevendo a nossa história', 'Cada momento com você é um presente', 'Você é a resposta das minhas orações', 'Com você, até os dias comuns brilham', 'O amor é paciente, o amor é bondoso', 'E isso é só o começo…'],
  outro: ['Tantos momentos juntos…', 'Deus colocou você no meu caminho', 'Cada lembrança é um presente', 'Obrigado por cada abraço', 'Você deixa a vida mais bonita', 'O amor nunca falha', 'E ainda vem muito mais…']
};
function filmCardHTML(L) {

    <button class="film-card" aria-label="Assistir ao mini filme"><img src="${L.film[0]}" alt=""><span class="fc-bars" aria-hidden="true"></span>

/* abre o filme em tela cheia: fotos com movimento, transições, frases, música e a tela final */
function playFilm(host, L, onEnd) {
  const fotos = L.film, frases = FRASES_FILME[L.r === 'amor' ? 'amor' : 'outro'], trans = ['fade', 'slide', 'zoom', 'flash', 'blur'];
  const o = document.createElement('div'); o.className = 'film'; o.setAttribute('role', 'dialog'); o.setAttribute('aria-label', 'Mini filme');
  o.innerHTML = `<div class="fm-stage"></div><i class="fm-bar t"></i><i class="fm-bar b"></i>
    <div class="fm-title"><span>Um filme de ${esc(L.from)} para</span><b class="gold-t shine">${esc(L.to)}</b></div>
    <p class="fm-txt"></p><div class="fm-prog"><i></i></div><button class="fm-x">Pular</button>
    <div class="fm-end" hidden><p class="fm-k">Fim… ou melhor, o começo</p><b class="gold-t shine">${esc(L.to)} &amp; ${esc(L.from)}</b>
      ${L.date ? `<p class="fm-d">Juntos desde ${esc(longDate(parseISO(L.date)))}</p>` : ''}<p class="fm-v">Que Deus continue escrevendo a nossa história</p>
      <div class="fm-btns"><button class="l-btn" data-fim>${ICON.heartFill}Continuar a carta</button><button class="l-btn ghost" data-de-novo>Assistir de novo</button></div></div>`;
  host.appendChild(o);
  const stage = o.querySelector('.fm-stage'), txt = o.querySelector('.fm-txt'), prog = o.querySelector('.fm-prog i'), end = o.querySelector('.fm-end');
  const tocouAntes = (L.ml || Music.playing); if (!tocouAntes) Music.start();
  let timers = [], acabou = false;
  const later = (f, ms) => timers.push(setTimeout(f, ms));
  const DUR = reduced() ? 1600 : 3300, T0 = 2600;
  const total = T0 + fotos.length * DUR;
  function cena(i) {
    const s = document.createElement('div'); s.className = `fm-shot t-${trans[i % trans.length]} kb${i % 4}`;
    s.innerHTML = `<img src="${fotos[i]}" alt="">`; stage.appendChild(s);
    void s.offsetWidth; s.classList.add('on');
    const ant = stage.children[stage.children.length - 2]; if (ant) { ant.classList.add('sai'); setTimeout(() => ant.remove(), 1400); }
    txt.classList.remove('on'); later(() => { txt.textContent = frases[i % frases.length]; txt.classList.add('on'); }, 500);
  }
  function fim() {
    if (acabou) return; acabou = true; timers.forEach(clearTimeout); timers = [];
    txt.classList.remove('on'); o.classList.add('final'); end.hidden = false; rain(o);
  }
  function rodar() {
    acabou = false; end.hidden = true; o.classList.remove('final'); stage.innerHTML = ''; txt.classList.remove('on');
    prog.style.transition = 'none'; prog.style.width = '0'; void prog.offsetWidth; prog.style.transition = `width ${total}ms linear`; prog.style.width = '100%';
    o.classList.remove('titulo'); void o.offsetWidth; o.classList.add('titulo');
    fotos.forEach((_, i) => later(() => cena(i), T0 + i * DUR));
    later(fim, total + 300);
  }
  const fechar = () => { timers.forEach(clearTimeout); if (!tocouAntes) Music.stop(); o.classList.add('fecha'); setTimeout(() => o.remove(), 500); onEnd(); };
  o.querySelector('.fm-x').addEventListener('click', fim);
  o.querySelector('[data-fim]').addEventListener('click', fechar);
  o.querySelector('[data-de-novo]').addEventListener('click', rodar);
  requestAnimationFrame(() => { o.classList.add('on'); rodar(); });
}
/* Premium: abertura de cinema antes da carta, com faixas de cinema, nomes em ouro e um clarão */
function cineOpen(host, L, onDone) {
  const tipo = L.r === 'amor' ? 'amor' : L.r === 'amigo' ? 'amizade' : 'família';
  const o = document.createElement('div'); o.className = 'cine-open';
  o.innerHTML = `<div class="co-dust" aria-hidden="true">${motes(30)}</div><i class="co-bar t"></i><i class="co-bar b"></i>
    <p class="co-1">Esta é uma história de ${tipo}</p>
    <p class="co-2"><span class="co-nome">${esc(L.to)} &amp; ${esc(L.from)}</span></p>
    <p class="co-3">${L.date ? 'desde ' + esc(longDate(parseISO(L.date))) : ''}</p>
    <i class="co-flare" aria-hidden="true"></i><button class="co-skip">Pular</button>`;
  host.appendChild(o);
  /* o nome do casal fica sempre numa linha só: se não couber, a letra diminui */
  const nome = o.querySelector('.co-2'), ajustar = () => {
    nome.style.fontSize = ''; const w = nome.firstElementChild.offsetWidth, max = o.clientWidth * .8;
    if (w > max) nome.style.fontSize = (parseFloat(getComputedStyle(nome).fontSize) * max / w) + 'px';
  };
  ajustar();
  let feito = false;
  const acabar = () => { if (feito) return; feito = true; o.classList.add('sai'); setTimeout(() => o.remove(), 900); onDone(); };
  o.querySelector('.co-skip').addEventListener('click', acabar);
  /* só começa com a letra cursiva já carregada, para o nome não trocar de fonte no meio (espera no máximo 0,8 s) */
  let comecou = false;
  const comecar = () => { if (comecou || feito) return; comecou = true; ajustar(); requestAnimationFrame(() => o.classList.add('on')); setTimeout(acabar, reduced() ? 600 : 7200); };
  try { document.fonts.load('400 80px "Great Vibes"').then(() => { ajustar(); comecar(); }, comecar); } catch (e) { comecar(); }
  setTimeout(comecar, 800);
}

function polHTML(p, i) {
  if (!p.src) return `<figure class="pol empty"><div class="pol-empty">${ICON.image}<span>Sua foto aqui</span></div><figcaption>&nbsp;</figcaption></figure>`;
  return `<figure class="pol" data-i="${i}" tabindex="0" role="button" aria-label="Ampliar foto"><img src="${p.src}" alt="${esc(p.cap || 'Foto')}"><figcaption>${esc(p.cap || '')}</figcaption></figure>`;
}

/* A carta inteira. Na carta aberta (mode "full") as partes aparecem uma de cada vez:
   data-step diz o que libera a próxima (next = botão Continuar, spin = girar a roleta,
   jar = ler todos os bilhetes, reveal = revelar a foto, ask = dizer sim, amen). A oração é a última. */
function letterHTML(L, mode, opt = {}) {
  const mini = mode === 'mini', full = mode === 'full', C = L.C, demo = full && opt.mode !== 'recipient';
  const pics = (L.maisFotos ? [0, 1, 2, 4, 5, 6] : [0, 1, 2]).map(i => ({ src: L.photos[i], cap: L.captions[i] })).filter(p => p.src);
  const NEXT = `<div class="l-next-wrap"><button class="l-next" hidden><span>Continuar</span>${ICON.down}</button></div>`;
  const rapido = full && opt.mode === 'example';
  const SKIP = demo && !rapido ? `<button class="l-skip" data-skip>Pular esta parte${ICON.down}</button>` : ''; // nas prévias de exemplo a carta passa sozinha ao rolar
  const sec = (id, cls, step, inner) => `<section class="lsec${cls ? ' ' + cls : ''}${full ? ' wait' : ''}"${id ? ` id="${id}"` : ''}${full ? ` data-step="${step}"` : ''}>${inner}${full && (step === 'next' || step === 'spin') ? NEXT : ''}</section>`;
  let h = `<div class="lt" data-theme="${L.theme}" data-mode="${mode}">`;
  if (!full) h += coverHTML(L, mode);
  h += `<div class="lb">`;
  h += sec('s-open', 'l-open', 'next', `<h2 class="l-to gold-t shine">Para ${esc(L.to)},</h2>`);
  /* ordem: roleta, música, fotos, pote, versículos, carta escrita, números, última foto */
  h += sec('s-wheel', '', 'spin', `<p class="l-label">A roleta da Palavra</p><h3 class="l-h gold-t">Gire e receba um versículo</h3><p class="l-sub">${WHEEL_SUB[L.r] || WHEEL_SUB.amor}</p>${wheelHTML()}
    <button class="l-btn wheel-btn">${ICON.sparkle}Girar a roleta</button>
    <div class="wheel-res" hidden aria-live="polite"><blockquote class="l-verse"><p class="chars"></p><cite></cite></blockquote></div>${SKIP}`);
  if (full && L.ml) h += sec('s-music', 'l-music', 'next', `<p class="l-label">Nossa música</p><h3 class="l-h gold-t">Esta é a nossa música</h3><p class="l-sub">Ela está tocando desde que você abriu a carta 🎶<br>Para pausar, use o botão “Nossa música” lá em cima.</p>`);
  if (pics.length || mini) {
    const grade = `<div class="pols${pics.length > 3 && L.premium ? ' pols6' : ''}${L.grandes ? ' grandes' : ''}" data-n="${pics.length || 3}">${(pics.length ? pics : [{}, {}, {}]).map(polHTML).join('')}</div>`;
    h += sec('s-photos', L.premium && full && pics.length > 1 ? 'cine-photos' : '', 'next', `<p class="l-label">Nossos momentos</p>${L.premium && full && pics.length > 1 ? slidesHTML(pics) + grade + SKIP : grade}`);
  }
  const n = L.reasons.length;
  h += sec('s-jar', '', 'jar', `<p class="l-label">O pote dos motivos</p><h3 class="l-h gold-t">${esc(C.jarH)}</h3><p class="l-sub">Toque no pote e tire um bilhete.</p>
    <div class="jar-wrap"><button class="jar" aria-label="Tirar um bilhete do pote">${jarSVG(n)}</button>
    ${n <= 14 ? `<div class="jar-prog" aria-hidden="true">${'<i></i>'.repeat(n)}</div>` : ''}
    <p class="jar-hint"><b>0</b> de ${n} bilhetes lidos</p>
    ${full ? '' : '<div class="slip" hidden aria-live="polite"><p></p><span class="slip-n"></span></div>'}
    ${full ? '<p class="gate-note">Leia todos os bilhetes para continuar a carta</p>' : ''}${SKIP}</div>`);
  h += sec('s-verses', 'l-verses', 'next', `<p class="l-label">Versículos que escolhi para você</p>${L.verses.map(verseHTML).join(FLOURISH)}`);
  h += sec('s-message', '', 'next', `<p class="l-label">${esc(C.msgLabel)}</p>${scrollHTML(L.message, full, rapido)}`);
  if (L.stats || mini) h += sec('s-numbers', `l-numbers${L.stats ? '' : ' ph-mode'}`, 'next', numbersHTML(L, C, !L.stats));
  if (L.photos[3]) h += sec('s-final', '', 'reveal', `<p class="l-label">Uma última foto</p>${cameraHTML(L, mini)}`);
  if (L.film.length) h += sec('s-film', '', 'film', filmCardHTML(L) + SKIP);
  if (L.ask) {
    h += sec('s-ask', '', 'ask', `<div class="ask"><p class="ask-k gold-t">${esc(L.to)},</p><h3>${esc(L.ask)}</h3>
      <div class="ask-btns"><button class="ask-yes">Sim!</button><button class="ask-no">Não</button></div>
      <div class="ask-done" hidden><b>Resposta: sim!</b><a class="l-btn light" href="${waLink(`Sim! Eu aceito, ${L.from}! ❤️`, L.phone)}" target="_blank" rel="noopener">${ICON.send}Contar para ${esc(L.from)}</a></div></div>`);
  }
  if (L.prayer) h += sec('s-prayer', '', 'amen', `<div class="pray"><div class="dove">${ICON.dove}</div><p class="l-label">${esc(C.prayLabel)}</p><p class="pray-t">${esc(L.prayer)}</p><button class="amen" aria-pressed="false">Amém</button><p class="amen-note" hidden>Agora vocês oraram juntos.</p></div>`);
  h += sec('s-close', 'l-closing', 'end', `${orn()}<p class="l-close">${esc(C.closing)}</p><p class="l-sign gold-t shine">${esc(L.from)}</p>
    <div class="l-actions">${opt.mode === 'recipient' ? `<a class="l-btn" href="${waLink(`${L.from}, recebi a sua carta e amei! ❤️`, L.phone)}" target="_blank" rel="noopener">${ICON.send}Responder ${esc(L.from)}</a>` : ''}<button class="l-btn ghost" data-again>Ler de novo</button>${opt.mode === 'preview' ? `<button class="l-btn ghost" data-editar>Voltar a editar</button>` : ''}</div>
    <div class="l-credit"><span class="row"><span class="seal"><span></span></span>Feito com ${BRAND}</span>${opt.mode === 'recipient' ? '<button data-make>Faça uma carta assim</button>' : ''}<small>Versículos da Bíblia Livre (BLIVRE), © Diego Santos, Mario Sérgio e Marco Teles, CC BY 4.0.</small></div>`);
  h += `</div></div>`;

const fotosDB = (() => {
  let dbp = null;
  const abrir = () => dbp || (dbp = new Promise((ok, erro) => {
    try { const r = indexedDB.open('cp2', 1); r.onupgradeneeded = () => r.result.createObjectStore('fotos'); r.onsuccess = () => ok(r.result); r.onerror = () => erro(r.error); } catch (e) { erro(e); }
  }));
  const tx = (modo, f) => abrir().then(db => new Promise((ok, erro) => { const t = db.transaction('fotos', modo), r = f(t.objectStore('fotos')); t.oncomplete = () => ok(r && r.result); t.onerror = () => erro(t.error); }));
  return { pegar: i => tx('readonly', st => st.get(i)), guardar: (i, v) => tx('readwrite', st => v == null ? st.delete(i) : st.put(v, i)) };
})();

/* ----- Busca da música pelo nome (sugestões do YouTube). Se o limite do dia acabar, fica só o link ----- */
const buscaMusica = { q: '', itens: [], timer: null, n: 0, carregando: false, limite: (() => { try { return sessionStorage.getItem('cp2:buscaLimite') === new Date().toDateString(); } catch (e) { return false; } })() };
async function buscarMusica(el) {
  const q = buscaMusica.q.trim(), n = ++buscaMusica.n;
  if (q.length < 3) { buscaMusica.itens = []; return pintarSugestoes(el); }
  buscaMusica.carregando = true; pintarSugestoes(el);
  let j = null;
  try { j = await api('/buscar?q=' + encodeURIComponent(q)); } catch (e) {}
  if (n !== buscaMusica.n) return; // chegou uma busca mais nova
  buscaMusica.carregando = false;
  if (j && j.limite) {
    buscaMusica.limite = true; try { sessionStorage.setItem('cp2:buscaLimite', new Date().toDateString()); } catch (e) {}
    toast('A busca de músicas está indisponível agora. Cole o link do YouTube ou do Spotify.');
    return rerender();
  }
  buscaMusica.itens = j && j.itens ? j.itens : null;
  pintarSugestoes(el);
}
function pintarSugestoes(el) {
  const box = $('#sugsYt', el); if (!box) return;
  const atual = (lerMusica(S.musicLink) || {}).id;
  if (buscaMusica.carregando) { box.innerHTML = `<p class="sug-msg"><span class="spin"></span>Procurando…</p>`; return; }
  if (buscaMusica.itens === null) { box.innerHTML = '<p class="sug-msg">Não deu para buscar agora. Tente de novo ou cole o link.</p>'; return; }
  if (!buscaMusica.itens.length) { box.innerHTML = buscaMusica.q.trim().length >= 3 ? '<p class="sug-msg">Nada encontrado. Tente com o nome do cantor.</p>' : ''; return; }
  box.innerHTML = buscaMusica.itens.map(x => `<button class="sug-yt${x.y === atual ? ' on' : ''}" data-yt="${esc(x.y)}">${x.img ? `<img src="${esc(x.img)}" alt="" loading="lazy">` : '<span class="sug-img"></span>'}<span><b>${esc(x.t)}</b><small>${esc(x.c)}</small></span>${x.y === atual ? ICON.check : ''}</button>`).join('');
  box.querySelectorAll('[data-yt]').forEach(b => b.addEventListener('click', () => {
    const it = buscaMusica.itens.find(x => x.y === b.dataset.yt); if (!it) return;
    S.musicLink = 'https://youtu.be/' + it.y; S.musicNome = it.t;
    const link = $('#fLink', el); if (link) link.value = S.musicLink;
    $('#linkHint', el).textContent = linkHint(); pintarSugestoes(el); changed();
  }));
}

/* ===== Meu acesso (/meuacesso): com o e-mail da compra, a pessoa vê todas as cartas pagas,

const ACE = 'cp2:acesso';

const naAcesso = () => ui.acesso || S.view === 'done';
const rotaAcessoUrl = () => /^\/meuacesso\/?$/i.test(location.pathname);

  ui.acesso = true; acesso.novo = novo || null;
  if (!rotaAcessoUrl()) { try { history[trocarUrl ? 'replaceState' : 'pushState'](null, '', '/meuacesso'); } catch (e) {} }
  carregarAcesso(); render('fwd');
}
function sairAcesso() {

  if (rotaAcessoUrl()) { try { history.pushState(null, '', '/'); } catch (e) {} }
}
async function carregarAcesso(email) {
  if (email != null) acesso.email = email.trim().toLowerCase();
  if (!isEmail(acesso.email)) { acesso.cartas = null; return; }
  store.set(ACE, { email: acesso.email });
  acesso.carregando = true; acesso.erro = ''; redesenharAcesso();
  try { const j = await api('/acesso', { email: acesso.email }); acesso.cartas = Array.isArray(j.cartas) ? j.cartas : []; }
  catch (e) { acesso.erro = e.status === 429 ? 'Muitas consultas seguidas. Espere um pouco e tente de novo.' : 'Não foi possível buscar as cartas agora. Confira sua internet e tente de novo.'; }
  acesso.carregando = false; redesenharAcesso();
}

/* salvar a imagem do cartão: no iPhone (e dentro do Instagram) o "download" comum não funciona,

async function baixarImagem(blob, nome, dica) {
  const aviso = t => { if (dica) { dica.hidden = false; dica.textContent = t; } };
  const ios = /iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const appInterno = /Instagram|FBAN|FBAV|FB_IAB|Line\/|WhatsApp/i.test(navigator.userAgent);
  if (blob && navigator.canShare) {
    try {
      const arq = new File([blob], nome, { type: 'image/png' });
      if (navigator.canShare({ files: [arq] })) { await navigator.share({ files: [arq] }); aviso('No menu que abriu, toque em "Salvar imagem" para guardar na galeria.'); return; }
    } catch (e) { if (e && e.name === 'AbortError') return; }
  }
  if (blob && !ios && !appInterno) {
    const u = URL.createObjectURL(blob), a = document.createElement('a'); a.href = u; a.download = nome; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(u), 4000);
    aviso('A imagem foi baixada. Procure na pasta de downloads.'); return;
  }
  aviso(appInterno ? 'Aqui dentro do Instagram o download é bloqueado. Toque e segure a imagem acima e escolha "Salvar na Fotos". Ou abra o site no Safari (menu ⋯ › Abrir no navegador).' : 'Toque e segure a imagem acima e escolha "Salvar na Fotos".');
  const img = document.querySelector('.card-img'); if (img) img.scrollIntoView({ behavior: 'smooth', block: 'center' });
}

function editarCarta(c) {
  if (c.local || (S.code === c.id && pedido && pedido.id === c.id && pedido.chave)) { S.view = 'ready'; save(); sairAcesso(); render('fwd'); return; }
  const rascunho = !S.code && S.view !== 'done' && (S.recipient || (S.to || '').trim());
  if (rascunho && !confirm('Você tem uma carta sendo montada neste aparelho. Para editar esta, o rascunho será trocado por ela. Continuar?')) return;

/* o contrário de cartaParaServidor: a carta salva vira o rascunho do criador */
function rascunhoDoServidor(P, plano, extras) {
  const r = REC[P.r] ? P.r : 'amor', ok = u => typeof u === 'string' && /^[\w\/.-]+$/.test(u) ? u : null;
  const fu = Array.isArray(P.fu) ? P.fu : [], fc = Array.isArray(P.fc) ? P.fc : [], mf = Array.isArray(P.mf) ? P.mf : [];
  const caminhos = Array(NFOTOS).fill(null);
  [0, 1, 2, 4, 5, 6].forEach((i, j) => { caminhos[i] = ok(fu[j]); });
  caminhos[3] = ok(P.ffu);
  mf.slice(0, 7).forEach((u, j) => { caminhos[7 + j] = ok(u); });
  const txt = (x, n) => typeof x === 'string' ? x.slice(0, n) : '';
  const names = { to: txt(P.p, 40), from: txt(P.d, 40) };
  let prayer = -1, prayerCustom = '';
  if (P.ora) { const k = PRAYERS[r].findIndex(t => fill(t, names) === P.ora); if (k >= 0 && k < 3) prayer = k; else { prayer = 3; prayerCustom = txt(P.ora, 800); } }
  const mus = infoMusica(P.ml);
  const campos = {
    recipient: r, occasion: OCC[P.oc] ? P.oc : OCCASIONS[r][0].id, to: names.to, from: names.from, date: txt(P.dt, 10),
    verses: (Array.isArray(P.v) ? P.v : []).filter(id => VERSES[id]), message: txt(P.m, 1500),
    reasons: (Array.isArray(P.mot) ? P.mot : []).map(x => txt(x, 120)).filter(Boolean).slice(0, 20),
    prayer, prayerCustom, plano: plano === 'premium' ? 'premium' : 'padrao', extras: extrasValidos(plano === 'premium' ? 'premium' : 'padrao', extras || P.ex),
    music: mus ? 'link' : P.mu ? 'instrumental' : 'none', musicLink: mus ? (mus.tipo === 'y' ? 'https://youtu.be/' + mus.id : 'https://open.spotify.com/' + mus.id) : '',
    theme: THEMES.some(t => t.id === P.th) ? P.th : null,
    captions: [0, 1, 2].map(i => txt(fc[i], 40)).concat(txt(P.ffc, 40), [3, 4, 5].map(i => txt(fc[i], 40)))
  };
  return { campos, caminhos, fotos: caminhos.map(u => u ? `https://res.cloudinary.com/${CLOUD.nome}/image/upload/${u}` : null) };
}

/* e-mail com o link e o QR code: avisa que foi (ou está indo) ou oferece mandar */
function pintarEmail(el, conferir) {
  const box = $('#mailArea', el); if (!box) return;
  if (!cfg.email || !editavel()) { box.innerHTML = ''; return; }
  const foi = pedido.emailOk, pediu = pedido.querEmail;
  box.innerHTML = foi || pediu
    ? `<p class="mail-note">${ICON.mail}<span>${foi ? 'Enviamos' : 'Estamos enviando'} o link e o QR code para <b>${esc(S.email)}</b>. Se não aparecer, olhe a caixa de spam. <button class="link" id="mailBtn">Mandar de novo</button></span></p>`
    : `<button class="btn btn-ghost w" id="mailBtn">${ICON.mail}Receber a carta no meu e-mail</button>`;
  $('#mailBtn', box).addEventListener('click', async e => {
    const b = e.currentTarget; if (b.disabled) return; b.disabled = true;
    try {
      await api('/email', { id: pedido.id, chave: pedido.chave });
      pedido.emailOk = pedido.querEmail = true; store.set(PED, pedido); pintarEmail(el);
      toast('Enviamos o link e o QR code para o seu e-mail');
    } catch (err) { b.disabled = false; toast(err.dados && err.dados.erro === 'limite' ? 'Já mandamos algumas vezes. Olhe a caixa de spam.' : 'Não foi possível mandar agora. Tente de novo daqui a pouco.'); }
  });
  /* se ainda estava indo, confere de novo daqui a pouco */
  if (conferir && pediu && !foi) setTimeout(() => api('/status?id=' + encodeURIComponent(pedido.id)).then(j => {
    if (j.email === 'enviado' && pedido && !pedido.emailOk) { pedido.emailOk = true; store.set(PED, pedido); pintarEmail(el); }

async function api(caminho, corpo) {
  const r = await fetch(API + caminho, corpo ? { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(corpo) } : { cache: 'no-store' });
  let j = {}; try { j = await r.json(); } catch (e) {}
  if (!r.ok) throw Object.assign(new Error(j.erro || 'falha'), { dados: j, status: r.status });
  return j;
}
/* fotos vão para o Cloudinary; a carta guarda só o caminho de cada uma */
const fotosUp = (store.get('cp2:fotosUp') || []).concat(Array(NFOTOS).fill(null)).slice(0, NFOTOS);
const fotoChave = d => d.length + ':' + d.slice(-48);

  const usadas = [0, 1, 2, 3].concat(temRec(S, 'fotos') ? [4, 5, 6] : [], temRec(S, 'filme') ? (S.plano === 'premium' ? [7, 8, 9, 10, 11, 12, 13] : [7, 8, 9]) : []);
  const out = Array(NFOTOS).fill(null), falta = usadas.filter(i => S.photos[i] && !(fotosUp[i] && fotosUp[i].k === fotoChave(S.photos[i])));
  for (const i of usadas) {

    if (falta.includes(i)) {
      msg(`Guardando as fotos (${falta.indexOf(i) + 1} de ${falta.length})…`);
      const fd = new FormData(); fd.append('file', d); fd.append('upload_preset', CLOUD.preset); fd.append('folder', 'cartas');
      let u = '';
      try { const r = await fetch(`https://api.cloudinary.com/v1_1/${encodeURIComponent(CLOUD.nome)}/image/upload`, { method: 'POST', body: fd }); if (r.ok) u = ((await r.json()).secure_url || '').split('/image/upload/')[1] || ''; } catch (e) {}

      fotosUp[i] = { k: fotoChave(d), u }; store.set('cp2:fotosUp', fotosUp);

function erroTexto(e, salvar) {
  if (e.status === 413) return 'A carta ficou grande demais. Encurte a mensagem ou a oração.';
  if (e.tipo === 'upload') return 'Não foi possível guardar as fotos agora. Confira sua internet e tente de novo.';
  if (e.dados && e.dados.erro === 'prazo') return 'O prazo de 7 dias para mudar esta carta acabou. O link abre a última versão salva.';
  return salvar ? 'Não foi possível salvar agora. Confira sua internet e tente de novo.' : 'Não foi possível iniciar o pagamento agora. Confira sua internet e tente de novo.';
}
