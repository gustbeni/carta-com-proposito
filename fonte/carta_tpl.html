function todayISO() { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; }
function parseISO(s) { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); }
function validDate(s) { if (!/^\d{4}-\d{2}-\d{2}$/.test(s || '')) return false; const d = parseISO(s); return !isNaN(d) && d <= new Date() && d.getFullYear() > 1900; }
function longDate(d) { return d.toLocaleDateString('pt-BR', { day: 'numeric', month: 'long', year: 'numeric' }); }
function calcStats(s) {
  const d = parseISO(s), now = new Date(), ms = now - d;
  if (ms < 0) return null;
  let years = now.getFullYear() - d.getFullYear();
  if (now.getMonth() < d.getMonth() || (now.getMonth() === d.getMonth() && now.getDate() < d.getDate())) years--;
  const days = Math.floor(ms / 864e5);
  return { days, nights: days, weeks: Math.floor(days / 7), hours: Math.floor(ms / 36e5), years: Math.max(0, years) };
}
function clockSince(s) {
  const ms = (new Date() - parseISO(s)) % 864e5;
  const h = Math.floor(ms / 36e5), m = Math.floor(ms / 6e4) % 60, sec = Math.floor(ms / 1e3) % 60;
  return `${pad(h)}h ${pad(m)}m ${pad(sec)}s`;
}

let toastTimer;
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('on');

}

function copyText(text, ok) {
  const done = () => toast(ok);
  const fallback = () => {
    const ta = document.createElement('textarea'); ta.value = text; ta.setAttribute('readonly', ''); ta.style.cssText = 'position:fixed;opacity:0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); done(); } catch (e) { toast('Selecione e copie o texto manualmente.'); }
    ta.remove();
  };
  try { navigator.clipboard.writeText(text).then(done, fallback); } catch (e) { fallback(); }
}

      <svg class="hc-heart" viewBox="-20 -18 40 36" aria-hidden="true"><path d="${HEART_PATH}" transform="translate(0 2) scale(1.55)" fill="rgba(176,36,78,.28)" stroke="#F3D58A" stroke-width=".7"/></svg>
      <div class="hc-num"><b class="l-big gold-t" data-count="${ph ? 0 : st.days}">${num('days')}</b></div>
      ${ph ? '' : hearts}
    </div>
    <div class="l-bigl">${esc(C.big)}</div>
    ${ph ? '' : `<div class="l-tick">${HOURGLASS}<span>e contando · <span data-tick="${L.date}">${clockSince(L.date)}</span></span></div>`}
    <div class="l-rows">${C.rows.map(([k, label]) => `<div class="l-row"><span class="r-ic">${ic[k] || CLOCK_IC}</span><b class="gold-t" data-count="${ph ? 0 : st[k]}">${num(k)}</b><span class="r-l">${esc(label)}</span></div>`).join('')}</div>`;
}

    <pattern id="cm${u}p" width="5" height="5" patternUnits="userSpaceOnUse"><circle cx="2.5" cy="2.5" r=".9" fill="rgba(0,0,0,.28)"/></pattern></defs>

    <rect x="8" y="58" width="304" height="144" rx="24" fill="url(#cm${u}a)"/>

    <circle class="cam-led" cx="40" cy="96" r="4.5" fill="#FF5A5A"/>

    <circle cx="160" cy="128" r="39" fill="url(#cm${u}c)"/>

const FRASES_FILME = {

/* abre o filme em tela cheia: fotos com movimento, transições, frases, música e a tela final */
function playFilm(host, L, onEnd) {
  const fotos = L.film, frases = FRASES_FILME[L.r === 'amor' ? 'amor' : 'outro'], trans = ['fade', 'slide', 'zoom', 'flash', 'blur'];
  const o = document.createElement('div'); o.className = 'film'; o.setAttribute('role', 'dialog'); o.setAttribute('aria-label', 'Mini filme');
  o.innerHTML = `<div class="fm-stage"></div><i class="fm-bar t"></i><i class="fm-bar b"></i>
    <div class="fm-title"><span>Um filme de ${esc(L.from)} para</span><b class="gold-t shine">${esc(L.to)}</b></div>
    <p class="fm-txt"></p><div class="fm-prog"><i></i></div><button class="fm-x">Pular</button>
    <div class="fm-end" hidden><p class="fm-k">Fim… ou melhor, o começo</p><b class="gold-t shine">${esc(L.to)} &amp; ${esc(L.from)}</b>
      ${L.date ? `<p class="fm-d">Juntos desde ${esc(longDate(parseISO(L.date)))}</p>` : ''}<p class="fm-v">Que Deus continue escrevendo a nossa história</p>
      <div class="fm-btns"><button class="l-btn" data-fim>${ICON.heartFill}Continuar a carta</button><button class="l-btn ghost" data-de-novo>Assistir de novo</button></div></div>`;
  host.appendChild(o);
  const stage = o.querySelector('.fm-stage'), txt = o.querySelector('.fm-txt'), prog = o.querySelector('.fm-prog i'), end = o.querySelector('.fm-end');
  const tocouAntes = (L.ml || Music.playing); if (!tocouAntes) Music.start();
  let timers = [], acabou = false;
  const later = (f, ms) => timers.push(setTimeout(f, ms));
  const DUR = reduced() ? 1600 : 3300, T0 = 2600;
  const total = T0 + fotos.length * DUR;
  function cena(i) {
    const s = document.createElement('div'); s.className = `fm-shot t-${trans[i % trans.length]} kb${i % 4}`;
    s.innerHTML = `<img src="${fotos[i]}" alt="">`; stage.appendChild(s);
    void s.offsetWidth; s.classList.add('on');
    const ant = stage.children[stage.children.length - 2]; if (ant) { ant.classList.add('sai'); setTimeout(() => ant.remove(), 1400); }
    txt.classList.remove('on'); later(() => { txt.textContent = frases[i % frases.length]; txt.classList.add('on'); }, 500);
  }
  function fim() {
    if (acabou) return; acabou = true; timers.forEach(clearTimeout); timers = [];
    txt.classList.remove('on'); o.classList.add('final'); end.hidden = false; rain(o);
  }
  function rodar() {
    acabou = false; end.hidden = true; o.classList.remove('final'); stage.innerHTML = ''; txt.classList.remove('on');
    prog.style.transition = 'none'; prog.style.width = '0'; void prog.offsetWidth; prog.style.transition = `width ${total}ms linear`; prog.style.width = '100%';
    o.classList.remove('titulo'); void o.offsetWidth; o.classList.add('titulo');
    fotos.forEach((_, i) => later(() => cena(i), T0 + i * DUR));
    later(fim, total + 300);
  }
  const fechar = () => { timers.forEach(clearTimeout); if (!tocouAntes) Music.stop(); o.classList.add('fecha'); setTimeout(() => o.remove(), 500); onEnd(); };
  o.querySelector('.fm-x').addEventListener('click', fim);
  o.querySelector('[data-fim]').addEventListener('click', fechar);
  o.querySelector('[data-de-novo]').addEventListener('click', rodar);
  requestAnimationFrame(() => { o.classList.add('on'); rodar(); });
}
/* Premium: abertura de cinema antes da carta, com faixas de cinema, nomes em ouro e um clarão */
function cineOpen(host, L, onDone) {
  const tipo = L.r === 'amor' ? 'amor' : L.r === 'amigo' ? 'amizade' : 'família';
  const o = document.createElement('div'); o.className = 'cine-open';
  o.innerHTML = `<div class="co-dust" aria-hidden="true">${motes(30)}</div><i class="co-bar t"></i><i class="co-bar b"></i>
    <p class="co-1">Esta é uma história de ${tipo}</p>
    <p class="co-2 gold-t shine">${esc(L.to)} &amp; ${esc(L.from)}</p>
    <p class="co-3">${L.date ? 'desde ' + esc(longDate(parseISO(L.date))) : esc(L.title)}</p>
    <i class="co-flare" aria-hidden="true"></i><button class="co-skip">Pular</button>`;
  host.appendChild(o);
  let feito = false;
  const acabar = () => { if (feito) return; feito = true; o.classList.add('sai'); setTimeout(() => o.remove(), 900); onDone(); };
  o.querySelector('.co-skip').addEventListener('click', acabar);
  requestAnimationFrame(() => o.classList.add('on'));
  setTimeout(acabar, reduced() ? 600 : 7200);
}

function polHTML(p, i) {
  if (!p.src) return `<figure class="pol empty"><div class="pol-empty">${ICON.image}<span>Sua foto aqui</span></div><figcaption>&nbsp;</figcaption></figure>`;
  return `<figure class="pol" data-i="${i}" tabindex="0" role="button" aria-label="Ampliar foto"><img src="${p.src}" alt="${esc(p.cap || 'Foto')}"><figcaption>${esc(p.cap || '')}</figcaption></figure>`;
}

/* A carta inteira. Na carta aberta (mode "full") as partes aparecem uma de cada vez:
   data-step diz o que libera a próxima (next = botão Continuar, spin = girar a roleta,
   jar = ler todos os bilhetes, reveal = revelar a foto, ask = dizer sim, amen). A oração é a última. */
function letterHTML(L, mode, opt = {}) {
  const mini = mode === 'mini', full = mode === 'full', C = L.C, demo = full && opt.mode !== 'recipient';
  const pics = (L.premium ? [0, 1, 2, 4, 5, 6] : [0, 1, 2]).map(i => ({ src: L.photos[i], cap: L.captions[i] })).filter(p => p.src);
  const NEXT = `<div class="l-next-wrap"><button class="l-next" hidden><span>Continuar</span>${ICON.down}</button></div>`;
  const SKIP = demo ? '<button class="link l-skip" data-skip>Pular (só na prévia)</button>' : '';
  const sec = (id, cls, step, inner) => `<section class="lsec${cls ? ' ' + cls : ''}${full ? ' wait' : ''}"${id ? ` id="${id}"` : ''}${full ? ` data-step="${step}"` : ''}>${inner}${full && (step === 'next' || step === 'spin') ? NEXT : ''}</section>`;
  let h = `<div class="lt" data-theme="${L.theme}" data-mode="${mode}">`;
  if (!full) h += coverHTML(L, mode);
  h += `<div class="lb">`;
  const music = full && L.ml ? `<div class="l-music"><p class="l-label">Nossa música</p><div class="mbox"></div><button class="l-btn ghost som-btn" hidden>${ICON.music}Toque para ouvir com som</button></div>` : '';
  h += sec('s-open', 'l-open', 'next', `<p class="l-date">${esc(longDate(new Date()))}</p><h2 class="l-to gold-t shine">Para ${esc(L.to)},</h2><p class="l-occ">${esc(L.title)}</p>${music}`);
  if (pics.length || mini) {
    const grade = `<div class="pols${pics.length > 3 ? ' pols6' : ''}" data-n="${pics.length || 3}">${(pics.length ? pics : [{}, {}, {}]).map(polHTML).join('')}</div>`;
    h += sec('s-photos', L.premium && full && pics.length > 1 ? 'cine-photos' : '', 'next', `<p class="l-label">Nossos momentos</p>${L.premium && full && pics.length > 1 ? slidesHTML(pics) + grade : grade}`);
  }
  h += sec('s-wheel', '', 'spin', `<p class="l-label">A roleta da Palavra</p><h3 class="l-h gold-t">Gire e receba um versículo</h3><p class="l-sub">${WHEEL_SUB[L.r] || WHEEL_SUB.amor}</p>${wheelHTML()}
    <button class="l-btn wheel-btn">${ICON.sparkle}Girar a roleta</button>
    <div class="wheel-res" hidden aria-live="polite"><blockquote class="l-verse"><p class="chars"></p><cite></cite></blockquote></div>${SKIP}`);
  if (L.stats || mini) h += sec('s-numbers', `l-numbers${L.stats ? '' : ' ph-mode'}`, 'next', numbersHTML(L, C, !L.stats));
  h += sec('s-message', '', 'next', `<p class="l-label">${esc(C.msgLabel)}</p>${scrollHTML(L.message, full)}`);
  const n = L.reasons.length;
  h += sec('s-jar', '', 'jar', `<p class="l-label">O pote dos motivos</p><h3 class="l-h gold-t">${esc(C.jarH)}</h3><p class="l-sub">Toque no pote e tire um bilhete.</p>
    <div class="jar-wrap"><button class="jar" aria-label="Tirar um bilhete do pote">${jarSVG(n)}</button>
    ${n <= 14 ? `<div class="jar-prog" aria-hidden="true">${'<i></i>'.repeat(n)}</div>` : ''}
    <p class="jar-hint"><b>0</b> de ${n} bilhetes lidos</p>
    ${full ? '' : '<div class="slip" hidden aria-live="polite"><p></p><span class="slip-n"></span></div>'}
    ${full ? '<p class="gate-note">Leia todos os bilhetes para continuar a carta</p>' : ''}${SKIP}</div>`);
  if (L.photos[3]) h += sec('s-final', '', 'reveal', `<p class="l-label">Uma última foto</p>${cameraHTML(L, mini)}`);
  if (L.premium && L.film.length) h += sec('s-film', '', 'film', filmCardHTML(L));
  h += sec('s-verses', 'l-verses', 'next', `<p class="l-label">Versículos que escolhi para você</p>${L.verses.map(verseHTML).join(FLOURISH)}`);
  if (L.ask) {
    h += sec('s-ask', '', 'ask', `<div class="ask"><p class="ask-k gold-t">${esc(L.to)},</p><h3>${esc(L.ask)}</h3>
      <div class="ask-btns"><button class="ask-yes">Sim!</button><button class="ask-no">Não</button></div>
      <div class="ask-done" hidden><b>Resposta: sim!</b><a class="l-btn light" href="${waLink(`Sim! Eu aceito, ${L.from}! ❤️`, L.phone)}" target="_blank" rel="noopener">${ICON.send}Contar para ${esc(L.from)}</a></div></div>`);
  }
  if (L.prayer) h += sec('s-prayer', '', 'amen', `<div class="pray"><div class="dove">${ICON.dove}</div><p class="l-label">${esc(C.prayLabel)}</p><p class="pray-t">${esc(L.prayer)}</p><button class="amen" aria-pressed="false">Amém</button><p class="amen-note" hidden>Agora vocês oraram juntos.</p></div>`);
  h += sec('s-close', 'l-closing', 'end', `${orn()}<p class="l-close">${esc(C.closing)}</p><p class="l-sign gold-t shine">${esc(L.from)}</p>
    <div class="l-actions"><a class="l-btn" href="${waLink(`${L.from}, recebi a sua carta e amei! ❤️`, L.phone)}" target="_blank" rel="noopener">${ICON.send}Responder ${esc(L.from)}</a><button class="l-btn ghost" data-again>Ler de novo</button></div>
    <div class="l-credit"><span class="row"><span class="seal"><span></span></span>Feito com ${BRAND}</span>${opt.mode === 'recipient' ? '<button data-make>Faça uma carta assim</button>' : ''}<small>Versículos da Bíblia Livre (BLIVRE), © Diego Santos, Mario Sérgio e Marco Teles, CC BY 4.0.</small></div>`);
  h += `</div></div>`;
  return h;
}

/* ===== Efeitos: abertura gloriosa, faíscas e chuva de corações ===== */
function sparkHTML(n, near, far, delay) {
  let s = '';
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, d = near + Math.random() * far;
    s += `<i class="gs ${i % 4 === 0 ? 'heart' : i % 3 === 0 ? 'star' : 'dot'}" style="--tx:${(Math.cos(a) * d).toFixed(0)}px;--ty:${(Math.sin(a) * d - 30).toFixed(0)}px;--r:${((Math.random() - .5) * 320).toFixed(0)}deg;--s:${(.6 + Math.random() * 1.2).toFixed(2)};--dl:${(delay + Math.random() * .35).toFixed(2)}s;--du:${(1.3 + Math.random() * 1.3).toFixed(2)}s"></i>`;
  }
  return s;
}
function glory(cv, env, mode) {
  const host = cv.querySelector('.glory'); if (!host || reduced()) return;

function loadDraft() {

  while (s.captions.length < 7) s.captions.push('');
  if (!s.recipient || !OCC[s.occasion]) { if (s.view !== 'step' || s.step > 1) { s.view = 'step'; s.step = s.recipient ? 1 : 0; } }

}
function save() { const { photos, ...rest } = S; store.set(KEY, rest); }
/* fotos guardadas no aparelho: IndexedDB aguenta fotos grandes; se não der, tenta o localStorage */
const fotosDB = (() => {
  let dbp = null;
  const abrir = () => dbp || (dbp = new Promise((ok, erro) => {
    try { const r = indexedDB.open('cp2', 1); r.onupgradeneeded = () => r.result.createObjectStore('fotos'); r.onsuccess = () => ok(r.result); r.onerror = () => erro(r.error); } catch (e) { erro(e); }
  }));
  const tx = (modo, f) => abrir().then(db => new Promise((ok, erro) => { const t = db.transaction('fotos', modo), r = f(t.objectStore('fotos')); t.oncomplete = () => ok(r && r.result); t.onerror = () => erro(t.error); }));
  return { pegar: i => tx('readonly', st => st.get(i)), guardar: (i, v) => tx('readwrite', st => v == null ? st.delete(i) : st.put(v, i)) };
})();
function savePhoto(i) {
  const v = S.photos[i];
  fotosDB.guardar(i, v).then(() => store.raw(PKEY(i), null)).catch(() => { if (!store.raw(PKEY(i), v)) toast('Não deu para guardar a foto neste aparelho, mas ela continua na carta.'); });
}

/* ----- Pagamento: Mercado Pago pelas funções do Netlify (pagar, status, atualizar) ----- */

async function api(caminho, corpo) {
  const r = await fetch(API + caminho, corpo ? { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(corpo) } : { cache: 'no-store' });
  let j = {}; try { j = await r.json(); } catch (e) {}
  if (!r.ok) throw Object.assign(new Error(j.erro || 'falha'), { dados: j, status: r.status });
  return j;
}
/* fotos vão para o Cloudinary; a carta guarda só o caminho de cada uma */
const fotosUp = (store.get('cp2:fotosUp') || []).concat(Array(NFOTOS).fill(null)).slice(0, NFOTOS);
const fotoChave = d => d.length + ':' + d.slice(-48);
async function subirFotos(msg) {
  const usadas = S.plano === 'premium' ? [...Array(NFOTOS).keys()] : [0, 1, 2, 3];
  const out = Array(NFOTOS).fill(null), falta = usadas.filter(i => S.photos[i] && !(fotosUp[i] && fotosUp[i].k === fotoChave(S.photos[i])));
  for (const i of usadas) {
    const d = S.photos[i]; if (!d) continue;
    if (falta.includes(i)) {
      msg(`Guardando as fotos (${falta.indexOf(i) + 1} de ${falta.length})…`);
      const fd = new FormData(); fd.append('file', d); fd.append('upload_preset', CLOUD.preset); fd.append('folder', 'cartas');
      let u = '';
      try { const r = await fetch(`https://api.cloudinary.com/v1_1/${encodeURIComponent(CLOUD.nome)}/image/upload`, { method: 'POST', body: fd }); if (r.ok) u = ((await r.json()).secure_url || '').split('/image/upload/')[1] || ''; } catch (e) {}
      if (!u) throw Object.assign(new Error('upload'), { tipo: 'upload' });
      fotosUp[i] = { k: fotoChave(d), u }; store.set('cp2:fotosUp', fotosUp);
    }
    out[i] = fotosUp[i].u;
  }
  return out;
}
function erroTexto(e, salvar) {
  if (e.status === 413) return 'A carta ficou grande demais. Encurte a mensagem ou a oração.';
  if (e.tipo === 'upload') return 'Não foi possível guardar as fotos agora. Confira sua internet e tente de novo.';
  if (e.dados && e.dados.erro === 'prazo') return 'O prazo de 7 dias para mudar esta carta acabou. O link abre a última versão salva.';
  return salvar ? 'Não foi possível salvar agora. Confira sua internet e tente de novo.' : 'Não foi possível iniciar o pagamento agora. Confira sua internet e tente de novo.';
}

/* pergunta ao servidor se o pagamento caiu (o webhook /api/aviso também confirma do lado do servidor) */

/* ----- Navegação ----- */
function go(i, dir) { S.view = 'step'; S.step = Math.max(0, Math.min(STEPS.length - 1, i)); save(); render(dir || 'fwd'); }
function next() {
  if (S.view === 'step') {
    const st = STEPS[S.step];
    if (!st.ok()) return;
    track('passo_' + st.id);
    if (S.step < STEPS.length - 1) return go(S.step + 1, 'fwd');
    Music.stop(); S.view = 'ready'; save(); render('fwd'); track('ViewContent', { content_name: 'Prévia da carta' });
    return openPreview(true);
  }
  if (S.view === 'ready') { if (editavel()) return salvarMudancas(); S.view = 'checkout'; save(); render('fwd'); return; }
  if (S.view === 'checkout') pay();
}
function back() {
  if (S.view === 'step') { if (S.step > 0) go(S.step - 1, 'back'); return; }
  if (S.view === 'ready') return go(STEPS.length - 1, 'back');
  if (S.view === 'checkout') { S.view = 'ready'; save(); render('back'); }
}
function rerender(keepFocus) {
  const y = window.scrollY;
  render(null);
  window.scrollTo(0, y);
  if (keepFocus) { const f = $('#fReason'); if (f) f.focus({ preventScroll: true }); }
}
function changed() { save(); refreshBar(); schedulePreview(); }

function render(dir) {
  const scr = $('#screen');
  if (S.view === 'step') { const id = STEPS[S.step].id; scr.innerHTML = VIEWS[id](); BIND[id](scr); }
  else if (S.view === 'ready') { scr.innerHTML = readyView(); bindReady(scr); }
  else if (S.view === 'checkout') { scr.innerHTML = checkoutView(); bindCheckout(scr); }
  else if (S.view === 'done') { scr.innerHTML = doneView(); bindDone(scr); }
  if (dir) {
    scr.classList.remove('enter', 'enter-back'); void scr.offsetWidth; scr.classList.add(dir === 'back' ? 'enter-back' : 'enter');
    window.scrollTo(0, 0);
    const h = scr.querySelector('.h1'); if (h && document.activeElement && document.activeElement !== document.body) h.focus({ preventScroll: true });
  }
  updateChrome();
  renderMini(!!dir);
}
function updateChrome() {
  const n = STEPS.length;
  $('#stepcount').textContent = S.view === 'step' ? `Passo ${S.step + 1} de ${n}` : ({ ready: editavel() ? 'Editando a carta' : 'Prévia pronta', checkout: 'Pagamento', done: 'Carta selada' })[S.view];
  $('#progress').style.setProperty('--p', `${S.view === 'step' ? (S.step + 1) / n * 100 : 100}%`);
  refreshBar();
}
function refreshBar() {
  const bar = $('#bar'), nx = $('#nextBtn'), note = $('#barNote'), eye = $('#eyeBtn');
  const hide = S.view === 'done' || (S.view === 'step' && S.step === 0);
  bar.hidden = hide; document.body.classList.toggle('nobar', hide);
  if (hide) return;
  eye.hidden = S.view === 'checkout';
  if (S.view === 'step') {
    const st = STEPS[S.step], last = S.step === STEPS.length - 1;
    nx.disabled = !st.ok();
    nx.innerHTML = last ? `Ver minha carta ${ICON.sparkle}` : (st.optional && st.empty() ? 'Pular' : `Continuar ${ICON.next}`);
    note.textContent = editavel() ? 'Editando a carta já paga · Salve no final' : 'Salvo neste aparelho';
  } else if (S.view === 'ready') {
    nx.disabled = ocupado;
    if (editavel()) { nx.innerHTML = `Salvar as mudanças ${ICON.check}`; note.textContent = 'O link e o QR code continuam os mesmos'; }
    else { nx.innerHTML = `Quero enviar · ${brl(precoDe(S.plano))}`; note.textContent = 'Pagamento único · Pix ou cartão · Garantia de 7 dias'; }
  } else if (S.view === 'checkout') {
    nx.disabled = ocupado; nx.innerHTML = `${ICON.lock}Pagar ${brl(precoDe(S.plano))}${S.pay === 'pix' ? ' com Pix' : ''}`;
    note.textContent = 'O link da carta aparece aqui assim que o pagamento cair';
  }
}

/* ----- Prévia ao vivo (desktop) ----- */
let miniTimer = null, miniCleanup = null, miniSec = null;
function schedulePreview() { clearTimeout(miniTimer); miniTimer = setTimeout(() => renderMini(false), 220); }
function renderMini(stepChanged) {
  if (!desk.matches) return;
  const m = $('#mini'), top = m.scrollTop;
  if (miniCleanup) miniCleanup();
  const L = resolveLetter(S);
  m.innerHTML = letterHTML(L, 'mini');
  const lt = m.firstElementChild; lt.style.setProperty('--cover-h', m.clientHeight + 'px');
  miniCleanup = bindLetter(m, L, 'mini');
  bindCover(m, 'mini', { onOpen() { const t = m.querySelector('#s-open'); if (t) m.scrollTo({ top: t.offsetTop - 10, behavior: 'smooth' }); } });
  const sec = S.view === 'step' ? STEPS[S.step].sec : 's-cover';
  if (stepChanged && sec !== miniSec) {
    miniSec = sec;
    const el = m.querySelector('#' + sec);
    m.scrollTop = top;
    requestAnimationFrame(() => m.scrollTo({ top: el && sec !== 's-cover' ? Math.max(0, el.offsetTop - 30) : 0, behavior: 'smooth' }));
  } else m.scrollTop = top;
}

/* ----- Arquivo de foto ----- */
function processImage(file) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const k = Math.min(1, 2048 / Math.max(img.naturalWidth, img.naturalHeight));
      const w = Math.round(img.naturalWidth * k), h = Math.round(img.naturalHeight * k);
      const c = document.createElement('canvas'); c.width = w; c.height = h;
      const x = c.getContext('2d'); x.imageSmoothingEnabled = true; x.imageSmoothingQuality = 'high'; x.drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg', .92));
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('img')); };
    img.src = url;
  });
}
$('#fileIn').addEventListener('change', async e => {
  const f = e.target.files && e.target.files[0], i = +e.target.dataset.i;
  if (!f) return;
  if (!/^image\//.test(f.type) && !/\.(heic|heif)$/i.test(f.name)) { toast('Escolha uma imagem (JPG ou PNG).'); return; }
  const slot = $(`[data-add="${i}"]`); if (slot) slot.classList.add('busy');
  try { S.photos[i] = await processImage(f); savePhoto(i); save(); rerender(); }
  catch (err) { if (slot) slot.classList.remove('busy'); toast('Não conseguimos abrir essa foto. Tente outra.'); }
});

/* ----- Quem recebe: /c/<id> ----- */
async function abrirCartaRecebida(id) {
  $('#app').hidden = true; document.title = 'Uma carta para você';
  const v = $('#viewer'); v.hidden = false;
  v.innerHTML = `<div class="msg-page"><span class="seal"><span>${ICON.heartFill}</span></span><p class="sub">Abrindo a sua carta…</p></div>`;
  let j = null;
  for (let t = 0; t < 3 && !j; t++) {
    try { const r = await fetch(API + '/carta?id=' + encodeURIComponent(id), { cache: 'no-store' }); const x = await r.json().catch(() => ({})); if (r.ok) j = x; else if (r.status === 404) break; } catch (e) {}
    if (!j) await new Promise(ok => setTimeout(ok, 1500));
  }
  if (j && j.bloqueada) return telaEspera(j);
  if (j && j.expirada) {
    v.innerHTML = `<div class="msg-page"><span class="seal"><span>${ICON.heartFill}</span></span><h1 class="h1">${j.p ? 'Uma carta para ' + esc(String(j.p).slice(0, 40)) : 'Esta carta'}</h1><p class="sub">Esta carta foi feita na versão Padrão, que fica no ar por 3 meses, e esse prazo acabou.</p><a class="btn btn-primary" href="/">Fazer uma carta</a></div>`;
    return;
  }
  if (!j || !j.carta) {
    v.innerHTML = `<div class="msg-page"><span class="seal"><span>${ICON.heartFill}</span></span><h1 class="h1">Não encontramos esta carta</h1><p class="sub">Confira se o link está completo. Se a carta acabou de ser paga, espere um minutinho e abra de novo.</p><a class="btn btn-primary" href="/">Conhecer a ${BRAND}</a></div>`;
    return;
  }
  const L = cartaDoServidor(j.carta);
  const abrir = () => openViewer(L, { mode: 'recipient', onMake: () => { location.href = '/'; }, onClose: abrir });
  abrir();
}
/* cartas antigas podiam ter dia marcado para abrir */
function telaEspera(j) {
  const alvo = Date.parse(j.ab), nome = String(j.p || '').slice(0, 40), de = String(j.d || '').slice(0, 40);
  $('#viewer').innerHTML = `<div class="msg-page"><span class="seal"><span>${ICON.heartFill}</span></span><h1 class="h1">${nome ? 'Uma carta para ' + esc(nome) : 'Uma carta para você'}</h1>
    <p class="sub">Ela foi preparada com carinho e só pode ser aberta em ${esc(longDate(new Date(alvo)))}.</p><p class="countdown" id="cdown"></p>${de ? `<p class="sub">Com carinho, ${esc(de)}</p>` : ''}</div>`;
  const tic = () => {
    let r = alvo - Date.now(); if (r <= 0) return location.reload();
    const d = Math.floor(r / 864e5); r %= 864e5; const h = Math.floor(r / 36e5); r %= 36e5;
    $('#cdown').textContent = `${d ? d + (d === 1 ? ' dia ' : ' dias ') : ''}${pad(h)}:${pad(Math.floor(r / 6e4))}:${pad(Math.floor(r % 6e4 / 1e3))}`;
  };
  tic(); setInterval(tic, 1000);
}

/* ----- Início ----- */
function iniciarCriador() {
  $('#backBtn').innerHTML = ICON.back;
  $('#eyeBtn').innerHTML = ICON.eye;
  $('#nextBtn').addEventListener('click', next);
  $('#backBtn').addEventListener('click', back);
  $('#eyeBtn').addEventListener('click', () => openPreview(S.view === 'ready' || S.step === STEPS.length - 1));
  $('#brandBtn').addEventListener('click', () => { if (S.view === 'done') return; go(0, 'back'); });
  desk.addEventListener ? desk.addEventListener('change', () => renderMini(true)) : desk.addListener(() => renderMini(true));
  window.addEventListener('resize', () => { const m = $('#mini'), lt = m && m.firstElementChild; if (lt && desk.matches) lt.style.setProperty('--cover-h', m.clientHeight + 'px'); });
  render(null);
  /* fotos guardadas no IndexedDB chegam depois do primeiro desenho da tela */
  Promise.all([...Array(NFOTOS).keys()].map(i => fotosDB.pegar(i).catch(() => null))).then(fs => {
    let mudou = false;
    fs.forEach((f, i) => { if (f && f !== S.photos[i]) { S.photos[i] = f; mudou = true; } });
    if (mudou) rerender();
  });
  /* volta do cartão (Mercado Pago manda para /?pedido=<id>) ou Pix ainda esperando */
  let q = null; try { q = new URLSearchParams(location.search).get('pedido'); } catch (e) {}
  if (q) { try { history.replaceState(null, '', location.pathname); } catch (e) {} }
  if (q && !(pedido && pedido.id === q)) { const ant = store.get('cd_pedido'); if (ant && ant.id === q && ant.chave) { pedido = { id: ant.id, chave: ant.chave, pago: false }; store.set(PED, pedido); } } // compra começada no site antigo
  if (pedido && !pedido.pago) {
    if (q === pedido.id) openSheet(`<p class="eyebrow">Cartão de crédito</p><h2 class="h2">Conferindo o seu pagamento</h2><div class="waiting"><span class="spin"></span>Aguardando a confirmação do Mercado Pago</div><p class="hint pix-note">Se o pagamento não foi aprovado, feche este aviso e tente de novo.</p>`);
    esperarPagamento(0);
  }
}
const rotaCarta = location.pathname.match(/\/c\/([A-Za-z0-9_-]{8,40})\/?$/);
if (rotaCarta) abrirCartaRecebida(rotaCarta[1]); else iniciarCriador();
</script>
