name: sondar-spotify
on:
  push:
    paths: [".github/workflows/sondar.yml"]
permissions:
  contents: write
jobs:
  s:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p ads/teste
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124 Safari/537.36"
          curl -sSL -A "$UA" "https://open.spotify.com/track/4cOdK2wGLETKBW3PvgPWqT" | grep -oE '<title>[^<]*</title>|<meta[^>]*(og:title|og:description|music:musician_description)[^>]*>' > ads/teste/sp_page.txt || true
          curl -sSL "https://open.spotify.com/oembed?url=https://open.spotify.com/track/4cOdK2wGLETKBW3PvgPWqT" > ads/teste/sp_oembed.json || true
          curl -sSL -A "facebookexternalhit/1.1" "https://open.spotify.com/track/4cOdK2wGLETKBW3PvgPWqT" | grep -oE '<title>[^<]*</title>|<meta[^>]*(og:title|og:description)[^>]*>' > ads/teste/sp_page_fb.txt || true
          git config user.name github-actions; git config user.email actions@github.com
          git add ads/teste; git commit -m "sondagem [skip netlify]" || exit 0; git push
