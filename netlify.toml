[build]
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/c/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/meuacesso"
  to = "/index.html"
  status = 200

# contador do funil (etapa() no carta_tpl.html): não guardar em cache, para contar cada visita
[[headers]]
  for = "/e.gif"
  [headers.values]
    Cache-Control = "no-store"
