[build]
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Domínio novo (22/11): quem chega pelo endereço antigo (anúncios, links e QR codes antigos) vai para cartacomproposito.com.br.
# As funções (/api/...) continuam respondendo no endereço antigo sem redirecionar, porque os avisos do Mercado Pago
# de pedidos antigos chegam lá por POST, e um redirecionamento quebraria a confirmação do pagamento.
[[redirects]]
  from = "https://carta-com-proposito.netlify.app/api/*"
  to = "/api/:splat"
  status = 200
  force = true

# Começo do site e Meu acesso no endereço antigo: página que leva para o domínio novo junto com o que ficou guardado no celular
[[redirects]]
  from = "https://carta-com-proposito.netlify.app/"
  to = "/migrar.html"
  status = 200
  force = true

[[redirects]]
  from = "https://carta-com-proposito.netlify.app/meuacesso"
  to = "/migrar.html"
  status = 200
  force = true

[[redirects]]
  from = "https://carta-com-proposito.netlify.app/*"
  to = "https://cartacomproposito.com.br/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/c/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/meuacesso"
  to = "/index.html"
  status = 200

# contador do funil (etapa() no carta_tpl.html): não guardar em cache, para contar cada visita
[[headers]]
  for = "/e.gif"
  [headers.values]
    Cache-Control = "no-store"
